        // ============================================================================
        // AKILLI BULUT YÖNETİMİ

        const OWNER_FIREBASE_CONFIG = {
            apiKey: "AIzaSyBn2f7sG_tb4AoCtx0AR1d3rw9OfhiW0Hc",
            authDomain: "performanspaneli.firebaseapp.com",
            projectId: "performanspaneli",
            storageBucket: "performanspaneli.appspot.com",
            messagingSenderId: "884074936264",

        const isOwnerDomain = () => {
            const host = window.location.hostname.toLowerCase();

        const parseFirebaseConfigText = (rawText) => {
            if (!rawText) return null;
            try {
                if (rawText.trim().startsWith('PP_CLOUD_')) {
                    const decoded = atob(rawText.trim().replace('PP_CLOUD_', ''));
                    return JSON.parse(decoded);
                }
                const extractField = (key) => {
                    const regex = new RegExp(key + '\\s*:\\s*["\']([^"\']+)["\']');
                    const m = rawText.match(regex);
                    return m ? m[1].trim() : '';
                };
                const apiKey = extractField('apiKey');
                const authDomain = extractField('authDomain');
                const projectId = extractField('projectId');
                const storageBucket = extractField('storageBucket');
                const messagingSenderId = extractField('messagingSenderId');
                const appId = extractField('appId');
                if (apiKey && projectId) {
                    return { apiKey, authDomain: authDomain || `${projectId}.firebaseapp.com`, projectId, storageBucket, messagingSenderId, appId };
                }
                const parsed = JSON.parse(rawText);
                if (parsed.apiKey && parsed.projectId) return parsed;
            } catch (e) {
                return null;
            }
            return null;
        };

        const encodePortableCloudKey = (cfg) => {
            try {
                return 'PP_CLOUD_' + btoa(JSON.stringify(cfg));

            const customSaved = localStorage.getItem('pp_custom_firebase_config');

                return { mode: 'local', config: null };
            }
            if (isOwnerDomain() && modePref !== 'setup_new') {
                return { mode: 'owner_cloud', config: OWNER_FIREBASE_CONFIG };

            return { mode: 'needs_setup', config: null };
        };

        const activeCloudInfo = getActiveCloudConfig();

        let db = null;

        if (activeCloudInfo.config) {
            try {
                if (!firebase.apps.length) {

        // Konuşma Sınavı Hedef Puanını Kriterlere Otomatik Dağıtma Fonksiyonu
        // (Öncelikle 0, 5, 10, 15, 20 gibi 5'in katlarına dengeli dağıtır; ara küsurat varsa tamamlar)
        const distributeSpeakingScoreToCriteria = (targetTotalScore, criteriaList) => {
            if (!Array.isArray(criteriaList) || criteriaList.length === 0) return {};
            const maxPossible = criteriaList.reduce((sum, c) => sum + (Number(c.max) || 0), 0);
            if (maxPossible === 0) return {};

            const target = Math.max(0, Math.min(maxPossible, Math.round(Number(targetTotalScore) || 0)));
            const ratio = target / maxPossible;

            // İlk aşama: Her kriterin oranına göre en yakın 5'in katına yuvarla
            let currentSum = 0;
            const items = criteriaList.map((c, idx) => {
                const max = Number(c.max) || 0;
                const exact = ratio * max;
                let val = Math.round(exact / 5) * 5;
                val = Math.max(0, Math.min(max, val));
                currentSum += val;
                return { id: c.id, max, exact, val, idx };
            });

            let diff = target - currentSum;

            // İkinci aşama: 5'er 5'er farkı kapat
            let guard = 0;
            while (Math.abs(diff) >= 5 && 100 > guard) {
                guard++;
                if (diff > 0) {
                    // En çok hak eden (exact - val farkı en büyük olan) ve max'a ulaşmamış kritere +5 ekle
                    const candidates = items.filter(it => it.max >= it.val + 5);
                    if (candidates.length === 0) break;
                    candidates.sort((a, b) => (b.exact - b.val) - (a.exact - a.val));
                    candidates[0].val += 5;
                    diff -= 5;
                } else {
                    // En az hak eden (val - exact farkı en büyük olan) ve 5'ten büyük olan kriterden -5 çıkar
                    const candidates = items.filter(it => it.val >= 5);
                    if (candidates.length === 0) break;
                    candidates.sort((a, b) => (b.val - b.exact) - (a.val - a.exact));
                    candidates[0].val -= 5;
                    diff += 5;
                }
            }

            // Üçüncü aşama: Kullanıcı 83 gibi 5'in katı olmayan bir sayı girdiyse kalan 1-4 puanlık farkı tamamla
            guard = 0;
            while (diff !== 0 && 100 > guard) {
                guard++;
                if (diff > 0) {
                    const candidates = items.filter(it => it.max > it.val);
                    if (candidates.length === 0) break;
                    candidates.sort((a, b) => (b.exact - b.val) - (a.exact - a.val));
                    const add = Math.min(diff, candidates[0].max - candidates[0].val);
                    candidates[0].val += add;
                    diff -= add;
                } else {
                    const candidates = items.filter(it => it.val > 0);
                    if (candidates.length === 0) break;
                    candidates.sort((a, b) => (b.val - b.exact) - (a.val - a.exact));
                    const sub = Math.min(Math.abs(diff), candidates[0].val);
                    candidates[0].val -= sub;
                    diff += sub;
                }
            }

            const result = {};
            items.forEach(it => { result[it.id] = it.val; });
            return result;
        };

        const DEFAULT_PERF_CONFIG = {

            perf2Items: [

        const calculateDynamicPerfScore = (assessment, items) => {
            if (!assessment || !Array.isArray(items) || items.length === 0) return null;
            let weightedSum = 0;
            let activeWeightTotal = 0;

            items.forEach(item => {
                const rawVal = assessment[item.id];
                const hasVal = rawVal !== null && rawVal !== undefined && rawVal !== '' && !isNaN(rawVal);
                const w = Number(item.weight) || 0;
                if (hasVal && w > 0) {
                    weightedSum += Number(rawVal) * w;
                    activeWeightTotal += w;
                }
            });

            if (activeWeightTotal === 0) return null;
            return Math.round(weightedSum / activeWeightTotal);
        };

        const fixSpacedTurkishName = (rawName) => {
            if (!rawName) return '';
            let s = String(rawName).replace(/\s+/g, ' ').trim().toLocaleUpperCase('tr-TR');
            const trSpecial = /^[ÇĞİÖŞÜ]$/;
            const vowels = /[AEIİOÖUÜ]/;

            let tokens = s.split(' ');
            let changed = true;
            let guard = 0;

            while (changed && 12 > guard) {
                changed = false;
                guard++;
                const nextTokens = [];
                let i = 0;

                while (tokens.length > i) {
                    const curr = tokens[i];
                    const next = i + 1 < tokens.length ? tokens[i + 1] : null;
                    const next2 = i + 2 < tokens.length ? tokens[i + 2] : null;

                    if (next && next2 && trSpecial.test(next)) {
                        if (3 >= curr.length || 3 >= next2.length || !vowels.test(curr) || !vowels.test(next2)) {
                            nextTokens.push(curr + next + next2);
                            i += 3;
                            changed = true;
                            continue;
                        }
                    }

                    if (next && 1 === curr.length) {
                        nextTokens.push(curr + next);
                        i += 2;
                        changed = true;
                        continue;
                    }

                    if (next && 1 === next.length) {
                        nextTokens.push(curr + next);
                        i += 2;
                        changed = true;
                        continue;
                    }

                    if (next && !vowels.test(curr) && 2 >= curr.length) {
                        nextTokens.push(curr + next);
                        i += 2;
                        changed = true;
                        continue;
                    }

                    nextTokens.push(curr);
                    i++;
                }
                tokens = nextTokens;
            }

            return tokens.join(' ');
        };

        const DynamicSpeakingExamModal = memo(({ student, criteria, scores, onSave, onClose, onScoreChange, onBatchScoresChange, examNumber, className }) => {
            const totalScore = criteria.reduce((sum, c) => sum + (Number(scores[c.id]) || 0), 0);
            const maxPossible = criteria.reduce((sum, c) => sum + (Number(c.max) || 0), 0);
            const [targetInput, setTargetInput] = useState(totalScore > 0 ? String(totalScore) : '');

            useEffect(() => {
                setTargetInput(totalScore > 0 ? String(totalScore) : '');
            }, [totalScore]);

            const getFiveStepOptions = (maxVal) => {
                const steps = [];
                for (let val = 0; maxVal >= val; val += 5) {
                    steps.push(val);
                }
                if (steps.length === 0 || steps[steps.length - 1] !== maxVal) {
                    steps.push(maxVal);
                }
                return steps;
            };

            const handleDistributeInput = (valStr) => {
                setTargetInput(valStr);
                if (valStr === '' || isNaN(valStr)) return;
                const distributed = distributeSpeakingScoreToCriteria(Number(valStr), criteria);
                onBatchScoresChange(distributed);
            };

            return (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 fade-in">
                    <div className="bg-slate-800 rounded-xl shadow-2xl border border-slate-700 w-full max-w-3xl flex flex-col max-h-[90vh]">

                                    <input
                                        type="number"
                                        placeholder="Örn: 85"
                                        value={targetInput}
                                        onChange={e => handleDistributeInput(e.target.value)}
                                        className={`w-16 p-1 text-center bg-slate-700 border border-slate-600 rounded text-sm font-bold text-amber-400 ${focusClasses}`}
                                    />
                                </div>
                                <button
                                    type="button"

        const SmartScoreButton = ({ label, colorClass, onIncrement, onDecrement }) => {
            const timerRef = useRef(null);
            const longPressTriggered = useRef(false);

            const handleTouchStart = () => {
                longPressTriggered.current = false;
                timerRef.current = setTimeout(() => {
                    longPressTriggered.current = true;
                    onDecrement();
                }, 500);
            };

            const handleTouchEnd = () => {
                if (timerRef.current) {
                    clearTimeout(timerRef.current);
                    timerRef.current = null;
                }
            };

            const handleClick = () => {
                if (longPressTriggered.current) {
                    longPressTriggered.current = false;
                    return;
                }
                onIncrement();
            };

            const handleContextMenu = (e) => {
                e.preventDefault();
                onDecrement();
            };

            return (
                <button
                    type="button"
                    onClick={handleClick}
                    onContextMenu={handleContextMenu}
                    onTouchStart={handleTouchStart}
                    onTouchEnd={handleTouchEnd}
                    onTouchCancel={handleTouchEnd}

        function PerformancePanel({ user, isLocalMode, onSwitchCloudMode }) {
            const [activeView, setActiveView] = useState('classes');

            const [activeClassId, setActiveClassId] = useState(null);
            const [editingNoteStudent, setEditingNoteStudent] = useState(null);

            const [studentToDelete, setStudentToDelete] = useState(null);
            const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);
            const [lastAction, setLastAction] = useState(null);
            const [undoMessage, setUndoMessage] = useState('');
            const [settings, setSettings] = useState({
                teacherName: '',
                schoolName: '',
                branchName: '',
                inClassPlus: 2,
                inClassMinus: -1,
                homeworkPlus: 5,
                homeworkMinus: -3,
                baseScore: 70,
                perfConfig: JSON.parse(JSON.stringify(DEFAULT_PERF_CONFIG))
            });
            const [tempSettings, setTempSettings] = useState(settings);
            const [showSaveConfirmation, setShowSaveConfirmation] = useState(false);
            const [newClassName, setNewClassName] = useState('');
            const [newStudentNumber, setNewStudentNumber] = useState('');
            const [newStudentName, setNewStudentName] = useState('');
            const [listText, setListText] = useState('');
            const [isParsingPdf, setIsParsingPdf] = useState(false);
            const [pdfStatusMsg, setPdfStatusMsg] = useState('');
            const [isLoading, setIsLoading] = useState(true);
            const [tempClassData, setTempClassData] = useState(null);
            const [activeSemester, setActiveSemester] = useState(1);
            const [searchTerm, setSearchTerm] = useState('');
            const [evaluatingSpeaking, setEvaluatingSpeaking] = useState(null);
            const [isCriteriaModalOpen, setIsCriteriaModalOpen] = useState(false);
            const [isPerfConfigModalOpen, setIsPerfConfigModalOpen] = useState(false);

            const activeClass = classes.find(c => String(c.id) === String(activeClassId)) || (classes.length > 0 ? classes[0] : null);
            const activePerfConfig = settings.perfConfig || DEFAULT_PERF_CONFIG;

            const syncAutoItemsInAssessment = (assessmentDonem, gradeVal, pConfig) => {
                const updated = { ...(assessmentDonem || {}) };
                const cfg = pConfig || DEFAULT_PERF_CONFIG;
                const allItems = [...(cfg.perf1Items || []), ...(cfg.perf2Items || [])];
                allItems.forEach(item => {
                    if (item.isAutoSync) {
                        updated[item.id] = gradeVal;
                    }
                });
                return updated;
            };

            const persistData = useCallback((newClasses, newSettings) => {
                if (isLocalMode) {
                    const payload = {
                        classes: newClasses !== undefined ? newClasses : classes,
                        settings: newSettings !== undefined ? newSettings : settings
                    };
                    localStorage.setItem('pp_local_user_data', JSON.stringify(payload));
                } else if (user && db) {
                    const updateObj = {};
                    if (newClasses !== undefined) updateObj.classes = newClasses;
                    if (newSettings !== undefined) updateObj.settings = newSettings;
                    db.collection('userData').doc(user.uid).set(updateObj, { merge: true });
                }
            }, [isLocalMode, user, classes, settings]);

            const handleExportBackupJson = () => {
                const backupPayload = {
                    version: '2.0',
                    exportDate: new Date().toISOString(),
                    settings,
                    classes,
                    cloudConfig: activeCloudInfo.mode === 'custom_cloud' ? activeCloudInfo.config : null
                };
                const blob = new Blob([JSON.stringify(backupPayload, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Performans_Paneli_Yedek_${new Date().toISOString().slice(0, 10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const handleImportBackupJson = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const parsed = JSON.parse(ev.target.result);
                        if (parsed && Array.isArray(parsed.classes)) {
                            setClasses(parsed.classes);
                            if (parsed.settings) {
                                setSettings(parsed.settings);
                                setTempSettings(parsed.settings);
                            }
                            persistData(parsed.classes, parsed.settings || settings);
                            if (parsed.classes.length > 0) setActiveClassId(parsed.classes[0].id);
                            alert('Yedek dosyası başarıyla yüklendi!');
                        } else {
                            alert('Geçersiz yedek dosyası formatı.');
                        }
                    } catch (err) {
                        alert('Yedek dosyası okunamadı: ' + err.message);
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            useEffect(() => {
                if (activeClass && String(activeClass.id) !== String(activeClassId)) {
                    setActiveClassId(activeClass.id);
                }
            }, [activeClass, activeClassId]);

            const getClassSpeakingCriteria = useCallback((cls) => {
                if (!cls) return DEFAULT_SPEAKING_PRESET;
                if (cls.speakingCriteria && Array.isArray(cls.speakingCriteria) && cls.speakingCriteria.length > 0) {
                    return cls.speakingCriteria;
                }
                const isNinth = cls.name && String(cls.name).trim().startsWith('9');
                return isNinth ? NINTH_GRADE_SPEAKING_PRESET : DEFAULT_SPEAKING_PRESET;
            }, []);

            useEffect(() => {
                const processLoadedData = (data, onSaveFixed) => {
                    const loadedSettings = {
                        ...settings,
                        ...(data.settings || {}),
                        perfConfig: (data.settings && data.settings.perfConfig)
                            ? data.settings.perfConfig
                            : JSON.parse(JSON.stringify(DEFAULT_PERF_CONFIG))
                    };
                    setSettings(loadedSettings);
                    setTempSettings(loadedSettings);

                    const calcSync = (scores) => {
                        if (!scores) return loadedSettings.baseScore;
                        const sc = loadedSettings.baseScore +
                            ((Number(scores.inClassPlus) || 0) * loadedSettings.inClassPlus) +
                            ((Number(scores.inClassMinus) || 0) * loadedSettings.inClassMinus) +
                            ((Number(scores.homeworkPlus) || 0) * loadedSettings.homeworkPlus) +
                            ((Number(scores.homeworkMinus) || 0) * loadedSettings.homeworkMinus);
                        return Math.max(0, Math.min(100, sc));
                    };

                    let anyNameFixed = false;

                    const migratedClasses = (data.classes || []).map(cls => {
                        const isNinth = cls.name && String(cls.name).trim().startsWith('9');
                        const defaultCrit = isNinth ? NINTH_GRADE_SPEAKING_PRESET : DEFAULT_SPEAKING_PRESET;
                        const classCriteria = (cls.speakingCriteria && cls.speakingCriteria.length > 0) ? cls.speakingCriteria : defaultCrit;

                        const migratedStudents = (cls.students || []).map(st => {
                            const student = { ...st };
                            if (!student.scores || !student.scores.donem1) {
                                const oldScores = (student.scores && student.scores.inClassPlus !== undefined) ? JSON.parse(JSON.stringify(student.scores)) : { ...defaultScores };
                                student.scores = { donem1: oldScores, donem2: { ...defaultScores } };
                            }
                            if (!student.assessments || !student.assessments.donem1) {
                                student.assessments = JSON.parse(JSON.stringify(newAssessmentStructure));
                            }
                            if (!student.speakingExams || !student.speakingExams.donem1) {
                                student.speakingExams = JSON.parse(JSON.stringify(newSpeakingExamStructure));
                            }
                            if (student.schoolNumber === undefined || student.schoolNumber === null) {
                                student.schoolNumber = '';
                            }
                            const cleanedName = fixSpacedTurkishName(student.name);
                            if (cleanedName !== student.name) {
                                student.name = cleanedName;
                                anyNameFixed = true;
                            }
                            student.assessments.donem1 = syncAutoItemsInAssessment(student.assessments.donem1, calcSync(student.scores.donem1), loadedSettings.perfConfig);
                            student.assessments.donem2 = syncAutoItemsInAssessment(student.assessments.donem2, calcSync(student.scores.donem2), loadedSettings.perfConfig);
                            return student;
                        });

                        return {
                            ...cls,
                            bookTitles: cls.bookTitles || JSON.parse(JSON.stringify(newBookTitleStructure)),
                            speakingCriteria: classCriteria,
                            students: sortStudentsList(migratedStudents)
                        };
                    });

                    setClasses(migratedClasses);
                    setActiveClassId(prevId => {
                        if (prevId && migratedClasses.some(c => String(c.id) === String(prevId))) return prevId;
                        return migratedClasses.length > 0 ? migratedClasses[0].id : null;
                    });

                    if (anyNameFixed && onSaveFixed) {
                        onSaveFixed(migratedClasses);
                    }
                };

                if (isLocalMode) {
                    setIsLoading(true);
                    const rawLocal = localStorage.getItem('pp_local_user_data');
                    if (rawLocal) {
                        try {
                            const parsed = JSON.parse(rawLocal);
                            processLoadedData(parsed, (fixedCls) => {
                                localStorage.setItem('pp_local_user_data', JSON.stringify({ ...parsed, classes: fixedCls }));
                            });
                        } catch (e) {}
                    }
                    setIsLoading(false);
                    return;
                }

                if (user && db) {
                    setIsLoading(true);
                    const docRef = db.collection('userData').doc(user.uid);
                    const unsubscribe = docRef.onSnapshot(doc => {
                        if (doc.exists) {
                            processLoadedData(doc.data(), (fixedCls) => {
                                docRef.set({ classes: fixedCls }, { merge: true });
                            });
                        }
                        setIsLoading(false);
                    }, err => {
                        console.error("Veri okuma hatası:", err);
                        setIsLoading(false);
                    });
                    return () => unsubscribe();
                }
            }, [user, isLocalMode]);

            useEffect(() => {
                const handler = setTimeout(() => {
                    if (!isLoading && activeView === 'classes') {
                        persistData(classes, settings);
                    }
                }, 1000);
                return () => clearTimeout(handler);
            }, [classes, settings, isLoading, activeView, persistData]);

            useEffect(() => {
                if (activeClass) {
                    setTempClassData(JSON.parse(JSON.stringify(activeClass)));
                } else {
                    setTempClassData(null);
                }
            }, [activeClassId, classes, activeView]);

            const handleSetActiveClassId = (id) => {
                setSearchTerm('');
                setActiveClassId(id);
            };

            const handleSaveFullSettings = (newSettingsObj) => {
                setSettings(newSettingsObj);
                setTempSettings(newSettingsObj);
                persistData(classes, newSettingsObj);
                setShowSaveConfirmation(true);
                setTimeout(() => setShowSaveConfirmation(false), 2000);
            };

            const handleUpdateStudentInfo = (studentId, newNo, newName) => {
                if (!activeClass) return;
                const updatedClasses = classes.map(c => String(c.id) === String(activeClass.id) ? {
                    ...c,
                    students: sortStudentsList(c.students.map(s => s.id === studentId ? { ...s, schoolNumber: newNo, name: newName } : s))
                } : c);
                setClasses(updatedClasses);
                persistData(updatedClasses, settings);
                setEditingStudent(null);
            };

            const handleEokulPdfUpload = async (e, targetClassId = null) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsParsingPdf(true);
                setPdfStatusMsg('PDF analiz ediliyor...');

                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let extractedStudents = [];
                    let detectedClassName = '';

                    const blacklist = [
                        'OKUL', 'KURUM', 'DÖNEM', 'PUAN', 'ÇİZELGESİ', 'ÖĞRENCİ', 'SINAVLAR',
                        'YAZILI', 'PERFORMANS', 'UYGULAMA', 'PROJE', 'MUAF', 'NUMARASI', 'SIRA',
                        'ADI SOYADI', 'DERS', 'ÖĞRETMENİ', 'MÜDÜR', 'YARDIMCISI', 'DEVAMSIZLIKTAN',
                        'BAŞARISIZ', 'SAYILAN', 'ALANI', 'DALI', 'ŞUBESİ', 'SAATİ', 'HAFTALIK',
                        'TÜRK DİLİ', 'EDEBİYATI', 'İSTANBUL', 'ANADOLU', 'LİSESİ', 'CE-OKUL'
                    ];

                    for (let pageNum = 1; pdf.numPages >= pageNum; pageNum++) {
                        const page = await pdf.getPage(pageNum);
                        const textContent = await page.getTextContent();
                        const fullPageText = textContent.items.map(i => i.str).join(' ');

                        if (!detectedClassName) {
                            const clsMatch = fullPageText.match(/(\d+)\.\s*Sınıf\s*\/\s*([A-ZÇĞİÖŞÜ])\s*Şubesi/i);
                            if (clsMatch) {
                                detectedClassName = `${clsMatch[1]}-${clsMatch[2].toUpperCase()}`;
                            }
                        }

                        const rows = [];
                        textContent.items.forEach(item => {
                            const str = item.str;
                            if (!str || !str.trim()) return;
                            const y = item.transform[5];
                            const x = item.transform[4];
                            const w = item.width || 0;
                            let row = rows.find(r => 4 > Math.abs(r.y - y));
                            if (!row) {
                                row = { y, items: [] };
                                rows.push(row);
                            }
                            row.items.push({ x, w, str: str.trim() });
                        });

                        rows.sort((a, b) => b.y - a.y);

                        rows.forEach(row => {
                            row.items.sort((a, b) => a.x - b.x);
                            let combinedLine = '';
                            for (let k = 0; row.items.length > k; k++) {
                                const currItem = row.items[k];
                                if (k === 0) {
                                    combinedLine += currItem.str;
                                } else {
                                    const prevItem = row.items[k - 1];
                                    const gap = currItem.x - (prevItem.x + prevItem.w);
                                    const isBothLetters = /^[A-ZÇĞİÖŞÜa-zçğıöşü]+$/.test(prevItem.str) && /^[A-ZÇĞİÖŞÜa-zçğıöşü]+$/.test(currItem.str);
                                    if (isBothLetters && 3.5 > gap) {
                                        combinedLine += currItem.str;
                                    } else {
                                        combinedLine += ' ' + currItem.str;
                                    }
                                }
                            }

                            const lineText = combinedLine.replace(/\|/g, ' ').replace(/\s+/g, ' ').trim();
                            const matchTwoNums = lineText.match(/^(\d+)\s+(\d+)\s+([A-ZÇĞİÖŞÜa-zçğıöşü\s]{3,})$/);
                            if (matchTwoNums) {
                                const n1 = parseInt(matchTwoNums[1], 10);
                                const n2 = parseInt(matchTwoNums[2], 10);
                                const fixedName = fixSpacedTurkishName(matchTwoNums[3]);
                                const isBlacklisted = blacklist.some(w => fixedName.includes(w));

                                if (!isBlacklisted && fixedName.includes(' ')) {
                                    const expectedSeq = extractedStudents.length + 1;
                                    let schoolNo = n1;
                                    if (n1 === expectedSeq && n2 !== expectedSeq) {
                                        schoolNo = n2;
                                    } else if (n2 === expectedSeq && n1 !== expectedSeq) {
                                        schoolNo = n1;
                                    } else if (60 >= n1 && n2 > 60) {
                                        schoolNo = n2;
                                    } else if (60 >= n2 && n1 > 60) {
                                        schoolNo = n1;
                                    } else {
                                        schoolNo = Math.max(n1, n2);
                                    }
                                    extractedStudents.push({ schoolNumber: String(schoolNo), name: fixedName });
                                }
                            }
                        });
                    }

                    if (extractedStudents.length === 0) {
                        alert("PDF içerisinden öğrenci okunamadı. e-Okul Puan Çizelgesi formatında olduğundan emin olun.");

                                [donemKey]: syncAutoItemsInAssessment(s.assessments?.[donemKey], newGrade, activePerfConfig)
                            };
                            return { ...s, scores: { ...s.scores, [donemKey]: newScores }, assessments: newAssessments };

                const { studentId, scoreType, classId, semester } = lastAction; 
                const donemKey = semester === 1 ? 'donem1' : 'donem2'; 
                let studentName = ''; 
                setClasses(prev => prev.map(c => { 
                    if (String(c.id) !== String(classId)) return c; 
                    return { ...c, students: c.students.map(s => { 
                        const currentScores = s.scores[donemKey] || defaultScores;
                        if (s.id === studentId && currentScores[scoreType] > 0) { 
                            studentName = s.name; 
                            const newScores = { ...currentScores, [scoreType]: currentScores[scoreType] - 1 }; 
                            const newGrade = calculateGrade(newScores);
                            const newAssessments = {
                                ...s.assessments,
                                [donemKey]: syncAutoItemsInAssessment(s.assessments?.[donemKey], newGrade, activePerfConfig)
                            };
                            return { ...s, scores: { ...s.scores, [donemKey]: newScores }, assessments: newAssessments }; 
                        } 
                        return s; 
                    })};

                setLastAction(null); 
                setTimeout(() => setUndoMessage(''), 3000); 
            };

            const distributeScores = (totalScore, criteria) => { 
                let distributed = {}; let currentTotal = 0; 
                const scoresWithDiff = Object.entries(criteria).map(([key, { max }]) => { 
                    const rawScore = (totalScore / 100) * max; 
                    const roundedScore = Math.round(rawScore); 
                    currentTotal += roundedScore; 
                    return { key, max, rounded: roundedScore, diff: roundedScore - rawScore }; 
                }); 
                let difference = totalScore - currentTotal; 
                scoresWithDiff.sort((a, b) => a.diff - b.diff); 
                while (difference !== 0) { 
                    for (const item of scoresWithDiff) { 
                        if (difference === 0) break; 
                        if (difference > 0 && item.max > item.rounded) { item.rounded++; difference--; } 
                        else if (0 > difference && item.rounded > 0) { item.rounded--; difference++; } 
                    } 
                } 
                scoresWithDiff.forEach(item => { distributed[item.key] = item.rounded; }); 
                return distributed;

                                            <div key={c.id} className="relative">
                                                <button onClick={() => handleSetActiveClassId(c.id)} className={`py-2 px-4 rounded-lg text-sm ${String(activeClass?.id) === String(c.id) ? 'bg-blue-600 font-bold text-white shadow-md' : 'bg-slate-700 hover:bg-slate-600 text-slate-200'}`}>
                                                    {c.name} ({c.students.length})
                                                </button>
                                                <button onClick={() => setClassToDelete(c)} className="absolute -top-1.5 -right-1.5 bg-red-500 text-white w-4 h-4 rounded-full flex items-center justify-center text-[10px] hover:bg-red-600" title="Sınıfı Sil">✕</button>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {activeClass ? (
                                    activeClass.students.length === 0 ? (
                                        <div className="bg-slate-900/50 border border-slate-700 rounded-xl p-6 space-y-6">
                                            <div>
                                                <h3 className="text-lg font-bold text-white mb-1">{activeClass.name} Sınıfına Öğrenci Aktar</h3>
                                                <label className="w-full flex items-center justify-center gap-2 bg-purple-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-purple-700 cursor-pointer text-sm">
                                                    <span>{isParsingPdf ? 'Yükleniyor...' : '📄 PDF Dosyası Seç'}</span>
                                                    <input type="file" accept="application/pdf" onChange={e => handleEokulPdfUpload(e, activeClass.id)} disabled={isParsingPdf} className="hidden" />
                                                </label>
                                            </div>
                                            <div className="border-t border-slate-700 pt-5">
                                                <h3 className="text-lg font-bold text-white mb-2">Metin Listesi Yapıştır</h3>
                                                <textarea value={listText} onChange={e => setListText(e.target.value)} placeholder={"434 MUHAMMED ALSILES\n500 BAHA KEREM KUDİŞ..."} className={`w-full h-28 p-3 bg-slate-700 border border-slate-600 rounded-lg mb-3 text-white text-sm ${focusClasses}`} />
                                                <button onClick={handleTextListSave} className="w-full bg-blue-600 text-white font-bold py-2.5 rounded-lg hover:bg-blue-700 text-sm">Kaydet</button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div>
                                            <div className="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3 mb-3">
                                                <div className="flex border-b border-slate-700">
                                                    <button onClick={() => setActiveSemester(1)} className={`py-2 px-4 font-semibold rounded-t-lg text-sm ${activeSemester === 1 ? 'bg-slate-800 border-b-2 border-blue-500 text-white' : 'text-slate-400'}`}>1. Dönem</button>
                                                    <button onClick={() => setActiveSemester(2)} className={`py-2 px-4 font-semibold rounded-t-lg text-sm ${activeSemester === 2 ? 'bg-slate-800 border-b-2 border-blue-500 text-white' : 'text-slate-400'}`}>2. Dönem</button>
                                                </div>
                                                <input type="text" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} placeholder="Öğrenci ara..." className={`sm:w-72 p-2 bg-slate-900 border border-slate-600 rounded-lg text-sm text-white ${focusClasses}`} />
                                            </div>

                                            <p className="text-xs text-slate-400 mb-3 bg-slate-900/40 p-2 rounded border border-slate-700/50">
                                                💡 <b>Pratik Kullanım:</b> <b>+</b> veya <b>-</b> tuşlarına normal tıklamak sayıyı <b>1 artırır</b>; aynı tuşa <b>sağ tıklamak</b> (mobil/tahtada <b>basılı tutmak</b>) sayıyı <b>1 azaltır (geri alır)</b>.
                                            </p>

                                            <div className="hidden md:grid grid-cols-12 gap-4 font-bold text-slate-400 text-xs p-2 border-b border-slate-700 mb-2">
                                                <div className="col-span-4">Öğrenci (Okul No - Ad Soyad)</div>
                                                <div className="col-span-3 text-center">Sınıf İçi (+/-)</div>
                                                <div className="col-span-3 text-center">Ödev (+/-)</div>
                                                <div className="col-span-1 text-center">Notlar</div>
                                                <div className="col-span-1 text-center">Sözlü</div>
                                            </div>

                                            <div className="space-y-2">
                                                {filteredStudents(activeClass.students).map(student => (
                                                    <StudentScoreRow
                                                        key={student.id}
                                                        student={student}
                                                        scores={student.scores[activeSemester === 1 ? 'donem1' : 'donem2'] || defaultScores}
                                                        index={activeClass.students.findIndex(s => s.id === student.id)}
                                                        onUpdateScore={updateStudentScore}
                                                        onManualChange={handleManualScoreChange}
                                                        onDelete={setStudentToDelete}
                                                        onOpenNotes={setEditingNoteStudent}
                                                        onOpenEdit={setEditingStudent}
                                                        calculateGrade={calculateGrade}
                                                    />
                                                ))}
                                            </div>

                                            <div className="mt-8 pt-5 border-t border-slate-700 flex flex-col sm:flex-row gap-2">
                                                <input type="text" value={newStudentNumber} onChange={e => setNewStudentNumber(e.target.value)} placeholder="Okul No" className={`sm:w-36 p-2 bg-slate-700 border border-slate-600 rounded-lg text-sm text-white ${focusClasses}`} />
                                                <input type="text" value={newStudentName} onChange={e => setNewStudentName(e.target.value)} placeholder="Öğrenci Adı Soyadı" className={`flex-grow p-2 bg-slate-700 border border-slate-600 rounded-lg text-sm text-white ${focusClasses}`} />
                                                <button onClick={handleAddStudent} className="bg-green-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-green-700 text-sm">Ekle</button>
                                                <label className="flex items-center justify-center bg-purple-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-purple-700 cursor-pointer text-sm">
                                                    <span>PDF Ekle</span>
                                                    <input type="file" accept="application/pdf" onChange={e => handleEokulPdfUpload(e, activeClass.id)} disabled={isParsingPdf} className="hidden" />
                                                </label>
                                            </div>
                                            <div className="flex flex-wrap justify-end items-center mt-6 gap-3">
                                                {undoMessage && <span className="text-green-400 text-xs font-semibold">{undoMessage}</span>}
                                                <button onClick={handleUndoLastAction} disabled={!lastAction} className="py-2 px-4 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-lg text-sm disabled:opacity-50">Son İşlemi Geri Al</button>
                                                <button onClick={handleGenerateSimplePdf} disabled={isGeneratingPdf} className="py-2 px-4 bg-slate-600 hover:bg-slate-500 text-white font-bold rounded-lg text-sm">Basit Rapor</button>
                                                <button onClick={handleGeneratePlusMinusReport} disabled={isGeneratingPdf} className="py-2 px-4 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-lg text-sm">Artı/Eksi Raporu</button>
                                                <button onClick={handleGenerateDetailedPdf} disabled={isGeneratingPdf} className="py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg text-sm">Detaylı Rapor</button>
                                            </div>
                                        </div>
                                    )
                                ) : <div className="text-center py-12 text-slate-400">Sınıf seçiniz veya oluşturunuz.</div>}
                            </div>
                        )}
                    </div>

                    {isPerfConfigModalOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 fade-in">
                            <div className="bg-slate-800 rounded-xl shadow-2xl border border-slate-700 w-full max-w-4xl flex flex-col max-h-[90vh]">
                                <div className="p-5 border-b border-slate-700 flex justify-between items-center">
                                    <h3 className="text-xl font-bold text-white">Performans Notu Kalemleri ve Yüzdelik Ayarları</h3>
                                    <button onClick={() => setIsPerfConfigModalOpen(false)} className="text-slate-400 hover:text-white p-1">✕</button>
                                </div>
                                <div className="p-5 overflow-y-auto flex-1">
                                    <PerfConfigEditor
                                        perfConfig={tempSettings.perfConfig || DEFAULT_PERF_CONFIG}
                                        onChange={newCfg => setTempSettings({ ...tempSettings, perfConfig: newCfg })}
                                        onResetDefault={() => setTempSettings({ ...tempSettings, perfConfig: JSON.parse(JSON.stringify(DEFAULT_PERF_CONFIG)) })}
                                    />
                                </div>
                                <div className="p-5 border-t border-slate-700 bg-slate-800/90 flex justify-end gap-3">
                                    <button onClick={() => setIsPerfConfigModalOpen(false)} className="py-2 px-5 bg-slate-600 text-white rounded-lg text-sm">Kapat</button>
                                    <button
                                        onClick={() => {
                                            handleSaveFullSettings(tempSettings);
                                            setIsPerfConfigModalOpen(false);
                                        }}
                                        className="py-2 px-6 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold text-sm"
                                    >
                                        Kaydet ve Uygula
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {isCriteriaModalOpen && activeClass && (
                        <CriteriaManagerModal
                            activeClass={activeClass}
                            onSaveCriteria={handleSaveClassCriteria}
                            onCopyCriteriaToAll={handleCopyCriteriaToAllClasses}
                            onClose={() => setIsCriteriaModalOpen(false)}
                        />
                    )}

                    {evaluatingSpeaking && (
                        <DynamicSpeakingExamModal
                            student={evaluatingSpeaking.student}
                            criteria={evaluatingSpeaking.criteria}
                            scores={evaluatingSpeaking.scores}
                            examNumber={evaluatingSpeaking.examNumber}
                            className={activeClass?.name}
                            onScoreChange={handleSpeakingScoreChange}
                            onBatchScoresChange={handleBatchSpeakingScoresChange}
                            onSave={handleSaveSpeakingExam}
                            onClose={() => setEvaluatingSpeaking(null)}
                        />
                    )}

                    {editingStudent && (
                        <EditStudentModal
                            student={editingStudent}
                            onSave={handleUpdateStudentInfo}
                            onClose={() => setEditingStudent(null)}
                        />
                    )}

                    {classToDelete && (
                        <ConfirmDialogModal
                            title="Sınıfı Silme Onayı"
                            message={`"${classToDelete.name}" sınıfını ve içerisindeki tüm öğrenci verilerini kalıcı olarak silmek istediğinize emin misiniz?`}
                            confirmText="Evet, Sınıfı Sil"
                            onConfirm={() => confirmDeleteClass(classToDelete.id)}
                            onCancel={() => setClassToDelete(null)}
                        />
                    )}

                    {studentToDelete && (
                        <ConfirmDialogModal
                            title="Öğrenciyi Silme Onayı"
                            message={`"${studentToDelete.schoolNumber ? '[' + studentToDelete.schoolNumber + '] ' : ''}${studentToDelete.name}" isimli öğrenciyi ve tüm notlarını silmek istediğinize emin misiniz?`}
                            confirmText="Evet, Öğrenciyi Sil"
                            onConfirm={() => handleDeleteStudent(studentToDelete.id)}
                            onCancel={() => setStudentToDelete(null)}
                        />
                    )}

                    {editingNoteStudent && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-800 rounded-xl p-6 border border-slate-700 max-w-lg w-full">
                                <h3 className="text-lg font-bold text-white mb-3">Öğrenci Notu: <span className="text-blue-400">{editingNoteStudent.name}</span></h3>
                                <textarea defaultValue={editingNoteStudent.notes} id="student-note-textarea" className="w-full h-40 p-3 bg-slate-700 border border-slate-600 rounded-lg text-white text-sm mb-4" placeholder="Notunuz..." />
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setEditingNoteStudent(null)} className="py-2 px-4 bg-slate-600 text-white rounded-lg text-sm">Kapat</button>
                                    <button onClick={() => { const val = document.getElementById('student-note-textarea').value; handleSaveNote(editingNoteStudent.id, val); }} className="py-2 px-5 bg-blue-600 text-white rounded-lg font-bold text-sm">Kaydet</button>
                                </div>
                            </div>
                        </div>
                    )}
                </Fragment>
            );
        }

        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [showSetup, setShowSetup] = useState(activeCloudInfo.mode === 'needs_setup');

            useEffect(() => {
                if (activeCloudInfo.mode === 'local' || activeCloudInfo.mode === 'needs_setup' || !auth) {
                    setLoading(false);
                    return;
                }
                const unsubscribe = auth.onAuthStateChanged(u => {
                    setUser(u);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            const handleOpenCloudSetup = () => {
                localStorage.setItem('pp_storage_mode', 'setup_new');
                setShowSetup(true);
            };

            const handleBackToOwner = () => {
                localStorage.removeItem('pp_custom_firebase_config');
                localStorage.removeItem('pp_storage_mode');
                window.location.reload();
            };

            if (loading) return <div className="text-center text-white text-xl mt-20">Yükleniyor...</div>;

            if (showSetup) {
                return (
                    <ErrorBoundary>
                        <CloudSetupScreen onBackToOwner={handleBackToOwner} />
                    </ErrorBoundary>
                );
            }

            if (activeCloudInfo.mode === 'local') {
                return (
                    <ErrorBoundary>
                        <PerformancePanel user={{ uid: 'local_user' }} isLocalMode={true} onSwitchCloudMode={handleOpenCloudSetup} />
                    </ErrorBoundary>
                );
            }

            return (
                <ErrorBoundary>
                    {user ? <PerformancePanel user={user} isLocalMode={false} onSwitchCloudMode={handleOpenCloudSetup} /> : <AuthScreen onOpenCloudSetup={handleOpenCloudSetup} />}
                </ErrorBoundary>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
