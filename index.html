<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performans Paneli</title>
    <meta name="theme-color" content="#1e293b">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        }
    </script>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@700&family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }

        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
        input[type='number']::-webkit-inner-spin-button, input[type='number']::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type='number'] { -moz-appearance: textfield; }
        .pdf-page-break { page-break-after: always; }
    </style>
</head>
<body class="bg-slate-900 flex items-start justify-center min-h-screen p-2 sm:p-4">
    <div id="root" class="w-full max-w-7xl"></div>

    <script type="text/babel">
        const { useState, useEffect, Fragment, useCallback, memo, Component } = React;

        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="bg-slate-800 border border-red-500 text-white p-6 rounded-xl max-w-xl mx-auto mt-10">
                            <h2 className="text-xl font-bold text-red-400 mb-2">Bir Hata Oluştu</h2>
                            <p className="text-sm text-slate-300 mb-4">{String(this.state.error)}</p>
                            <button onClick={() => window.location.reload()} className="bg-blue-600 px-4 py-2 rounded font-bold text-sm">Sayfayı Yenile</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBn2f7sG_tb4AoCtx0AR1d3rw9OfhiW0Hc",
            authDomain: "performanspaneli.firebaseapp.com",
            projectId: "performanspaneli",
            storageBucket: "performanspaneli.appspot.com",
            messagingSenderId: "884074936264",
            appId: "1:884074936264:web:0645577f7c66fecce8f2fd",
            measurementId: "G-4P30W8GEYJ"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        const EditIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
            </svg>
        );

        const DEFAULT_SPEAKING_PRESET = [
            { id: 'ifadeler', label: 'Konuşmada uygun başlangıç ve bitiş ifadeleri kullanılmış ve olaylar/bilgiler sıraya konularak anlatılmıştır.', max: 20 },
            { id: 'gerekce', label: 'Konuşmada öne sürmek için ortaya koyulan önerme gerekçelendirilmiştir.', max: 20 },
            { id: 'gereksizSes', label: 'Konuşmada gereksiz sesler (ıı, eee), tekrarlar ve duraksamalar görülmemiştir.', max: 20 },
            { id: 'telaffuz', label: 'Konuşmada ses, hece ve kelimelerin telaffuz, vurgu ve tonlaması doğrudur.', max: 20 },
            { id: 'sure', label: 'Konuşma, belirtilen sürede yapılmıştır.', max: 20 }
        ];

        const NINTH_GRADE_SPEAKING_PRESET = [
            { id: 'planlama', label: 'Planlama: Etkili bir giriş yapmış, konuşmayı sürdürmüş, uygun örnekler sunmuş ve etkili tamamlamıştır.', max: 15 },
            { id: 'dusunselSurec', label: 'Düşünsel Süreçleri Kontrol Etme: Düşünceleri ana fikir etrafında tekrara düşmeden sunmuştur.', max: 15 },
            { id: 'sozVarligi', label: 'Söz Varlığı: Bağlama uygun zengin kelime hazinesi ve Türkçe kelimeler kullanmıştır.', max: 15 },
            { id: 'organizasyon', label: 'Organizasyon: Duygu ve düşüncelerini tutarlı bir biçimde organize etmiştir.', max: 10 },
            { id: 'akicilik', label: 'Akıcılık: İşitilebilir ses tonuyla, gereksiz ses tekrarına düşmeden, vurgu ve tonlamaya dikkat ederek konuşmuştur.', max: 20 },
            { id: 'bedenDili', label: 'Beden Dili: Jest ve mimiklerini etkili kullanmış, dinleyicilerle yeterli göz teması kurmuştur.', max: 15 },
            { id: 'isBirligi', label: 'İş Birliği: Grup çalışmalarında üzerine düşen sorumlulukları yerine getirmiştir.', max: 10 }
        ];

        const IN_CLASS_CRITERIA = {
            derse_zamaninda_gelme: { label: 'Derse zamanında gelme', max: 5 },
            derse_devam_ilgi_saygi: { label: 'Derse devam, ilgi ve saygı', max: 10 },
            arac_gerec: { label: 'Ders araç ve gereçlerini getirme', max: 10 },
            ilgi_not_tutma: { label: 'Derse ilgi ve not tutma', max: 10 },
            soru_cevap: { label: 'Soru ve önerilere cevap verme', max: 10 },
            elestirel_dusunme: { label: 'Eleştirel düşünerek soru sorma', max: 10 },
            uygulama_istekli: { label: 'Uygulamalara katılmaya istekli olma', max: 10 },
            turkce_kullanimi: { label: 'Türkçeyi doğru kullanma ve olumlu davranış', max: 10 },
            on_hazirlik: { label: 'Konuya ön hazırlık yaparak gelme', max: 15 },
            odev_zamaninda: { label: 'Ödevlerini zamanında yapma', max: 10 }
        };

        const PERFORMANCE_TASK_CRITERIA = {
            ogretmenle_gorusme: { label: 'Öğretmenle düzenli görüşme ve önerileri dikkate alma', max: 5 },
            plan_yapma: { label: 'Ödeve uygun plan yapma ve bu plana göre ödevini hazırlama', max: 5 },
            bilgi_dogruluk: { label: 'Bilgilerin doğruluğu ve özgünlüğü', max: 10 },
            kavram_anlatma: { label: 'Temel kavramları anlatma, konunun özünü ifade etme', max: 15 },
            sunum_hakimiyet: { label: 'Ödevi sunma ve konuya hakimiyet', max: 25 },
            materyal_destek: { label: 'Yeterli materyalle (poster, grafik vb.) destekleme', max: 10 },
            anlasilir_yazma: { label: 'Anlaşılır yazma ve dilbilgisi kurallarına uyma', max: 10 },
            kaynak_kullanma: { label: 'Farklı kaynaklardan yararlanma ve belirtme', max: 10 },
            zamaninda_teslim: { label: 'Ödevi zamanında teslim etme', max: 10 }
        };

        const defaultScores = { inClassPlus: 0, inClassMinus: 0, homeworkPlus: 0, homeworkMinus: 0 };
        const newAssessmentStructure = {
            donem1: { dersIciDurum: null, yazma1: null, yazma2: null, kitap1: null, kitap2: null },
            donem2: { dersIciDurum: null, yazma1: null, yazma2: null, kitap1: null, kitap2: null }
        };
        const newBookTitleStructure = { donem1: { kitap1: '', kitap2: '' }, donem2: { kitap1: '', kitap2: '' } };
        const newSpeakingExamStructure = { donem1: { sinav1: null, sinav2: null }, donem2: { sinav1: null, sinav2: null } };

        const calculateWeightedPerf1 = (assessment) => {
            if (!assessment) return null;
            const d = assessment.dersIciDurum;
            const y1 = assessment.yazma1;
            const y2 = assessment.yazma2;
            const hasD = d !== null && d !== undefined && d !== '' && !isNaN(d);
            const hasY1 = y1 !== null && y1 !== undefined && y1 !== '' && !isNaN(y1);
            const hasY2 = y2 !== null && y2 !== undefined && y2 !== '' && !isNaN(y2);
            if (!hasD && !hasY1 && !hasY2) return null;

            let score = 0;
            let weightSum = 0;
            if (hasD) { score += Number(d) * 0.5; weightSum += 0.5; }
            if (hasY1 || hasY2) {
                const ySum = (hasY1 ? Number(y1) : 0) + (hasY2 ? Number(y2) : 0);
                const yCount = (hasY1 ? 1 : 0) + (hasY2 ? 1 : 0);
                score += (ySum / yCount) * 0.5;
                weightSum += 0.5;
            }
            return weightSum > 0 ? Math.round(score / weightSum) : null;
        };

        const sortStudentsList = (students) => {
            if (!Array.isArray(students)) return [];
            return [...students].sort((a, b) => {
                const numA = parseInt(a?.schoolNumber, 10);
                const numB = parseInt(b?.schoolNumber, 10);
                if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
                if (!isNaN(numA)) return -1;
                if (!isNaN(numB)) return 1;
                return String(a?.name || '').localeCompare(String(b?.name || ''), 'tr');
            });
        };

        const focusClasses = "focus:outline-none focus:ring-2 focus:ring-blue-500";

        function AuthScreen() {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isLogin, setIsLogin] = useState(true);
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                const action = isLogin ? auth.signInWithEmailAndPassword(email, password) : auth.createUserWithEmailAndPassword(email, password);
                action.catch(err => setError(err.message)).finally(() => setLoading(false));
            };

            return (
                <div className="bg-slate-800/60 backdrop-blur-sm border border-slate-700 rounded-2xl shadow-2xl p-8 text-white w-full max-w-md mx-auto mt-12 fade-in">
                    <h1 className="cool-title text-4xl font-bold text-center mb-6">Performans Paneli</h1>
                    <h2 className="text-xl font-bold text-center mb-6 text-slate-200">{isLogin ? 'Öğretmen Girişi' : 'Yeni Hesap Oluştur'}</h2>
                    <form onSubmit={handleSubmit} className="space-y-4">
                        <div>
                            <label className="block text-sm text-slate-400">E-posta Adresi</label>
                            <input type="email" value={email} onChange={e => setEmail(e.target.value)} required className={`w-full mt-1 p-2.5 bg-slate-700 border border-slate-600 rounded-lg text-white ${focusClasses}`} />
                        </div>
                        <div>
                            <label className="block text-sm text-slate-400">Şifre</label>
                            <input type="password" value={password} onChange={e => setPassword(e.target.value)} required className={`w-full mt-1 p-2.5 bg-slate-700 border border-slate-600 rounded-lg text-white ${focusClasses}`} />
                        </div>
                        {error && <p className="text-red-400 text-sm text-center">{error}</p>}
                        <button type="submit" disabled={loading} className="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 disabled:bg-slate-600">
                            {loading ? 'İşleniyor...' : (isLogin ? 'Giriş Yap' : 'Kayıt Ol')}
                        </button>
                    </form>
                    <p className="text-center text-slate-400 mt-5 text-sm">
                        {isLogin ? "Hesabınız yok mu? " : "Zaten hesabınız var mı? "}
                        <button onClick={() => setIsLogin(!isLogin)} className="font-semibold text-blue-400 hover:underline">
                            {isLogin ? 'Kayıt Olun' : 'Giriş Yapın'}
                        </button>
                    </p>
                </div>
            );
        }

        const EditStudentModal = ({ student, onSave, onClose }) => {
            const [no, setNo] = useState(student.schoolNumber || '');
            const [name, setName] = useState(student.name || '');

            return (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 fade-in">
                    <div className="bg-slate-800 rounded-xl p-6 border border-slate-700 max-w-md w-full shadow-2xl">
                        <h3 className="text-lg font-bold text-white mb-4">Öğrenci Bilgilerini Düzenle</h3>
                        <div className="space-y-3 mb-5">
                            <div>
                                <label className="block text-xs text-slate-400 mb-1">Okul Numarası</label>
                                <input type="text" value={no} onChange={e => setNo(e.target.value)} className={`w-full p-2 bg-slate-700 border border-slate-600 rounded-lg text-white text-sm ${focusClasses}`} />
                            </div>
                            <div>
                                <label className="block text-xs text-slate-400 mb-1">Adı Soyadı</label>
                                <input type="text" value={name} onChange={e => setName(e.target.value)} className={`w-full p-2 bg-slate-700 border border-slate-600 rounded-lg text-white text-sm ${focusClasses}`} />
                            </div>
                        </div>
                        <div className="flex justify-end gap-3">
                            <button onClick={onClose} className="py-2 px-4 bg-slate-600 text-white rounded-lg text-sm font-semibold">Vazgeç</button>
                            <button onClick={() => onSave(student.id, no.trim(), name.replace(/\s+/g, ' ').trim().toLocaleUpperCase('tr-TR'))} className="py-2 px-5 bg-blue-600 text-white rounded-lg font-bold text-sm">Güncelle</button>
                        </div>
                    </div>
                </div>
            );
        };

        const CriteriaManagerModal = ({ activeClass, onSaveCriteria, onCopyCriteriaToAll, onClose }) => {
            const initialCriteria = (activeClass.speakingCriteria && activeClass.speakingCriteria.length > 0)
                ? activeClass.speakingCriteria
                : (activeClass.name && activeClass.name.trim().startsWith('9') ? NINTH_GRADE_SPEAKING_PRESET : DEFAULT_SPEAKING_PRESET);

            const [items, setItems] = useState(JSON.parse(JSON.stringify(initialCriteria)));
            const totalMax = items.reduce((sum, item) => sum + (Number(item.max) || 0), 0);

            return (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 fade-in">
                    <div className="bg-slate-800 rounded-xl shadow-2xl border border-slate-700 w-full max-w-3xl flex flex-col max-h-[90vh]">
                        <div className="p-5 border-b border-slate-700 flex justify-between items-center">
                            <div>
                                <h3 className="text-xl font-bold text-white">Konuşma Sınavı Kriterlerini Özelleştir</h3>
                                <p className="text-xs text-slate-400 mt-1">Seçili Sınıf: <span className="text-amber-400 font-semibold">{activeClass.name}</span></p>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-white p-1">✕</button>
                        </div>
                        <div className="px-5 py-3 bg-slate-900/60 border-b border-slate-700 flex flex-wrap gap-2 items-center justify-between">
                            <div className="flex flex-wrap gap-2 items-center">
                                <span className="text-xs text-slate-400">Şablon Yükle:</span>
                                <button onClick={() => setItems(JSON.parse(JSON.stringify(DEFAULT_SPEAKING_PRESET)))} className="text-xs bg-slate-700 hover:bg-slate-600 text-sky-300 py-1.5 px-3 rounded-md font-medium">Standart (5 Kriter)</button>
                                <button onClick={() => setItems(JSON.parse(JSON.stringify(NINTH_GRADE_SPEAKING_PRESET)))} className="text-xs bg-slate-700 hover:bg-slate-600 text-purple-300 py-1.5 px-3 rounded-md font-medium">9. Sınıf (7 Kriter)</button>
                            </div>
                            <div className={`text-sm font-bold px-3 py-1 rounded-md ${totalMax === 100 ? 'bg-green-500/20 text-green-400' : 'bg-amber-500/20 text-amber-400'}`}>
                                Toplam Puan: {totalMax} / 100
                            </div>
                        </div>
                        <div className="p-5 overflow-y-auto space-y-3 flex-1">
                            {items.map((item, idx) => (
                                <div key={item.id || idx} className="flex items-start gap-2 bg-slate-900/50 p-3 rounded-lg border border-slate-700/70">
                                    <span className="bg-slate-700 text-slate-300 text-xs font-bold px-2 py-1.5 rounded mt-1">K.{idx + 1}</span>
                                    <textarea rows="2" value={item.label} onChange={e => setItems(prev => prev.map((it, i) => i === idx ? { ...it, label: e.target.value } : it))} className={`flex-grow p-2 bg-slate-700 border border-slate-600 rounded-md text-sm text-white ${focusClasses}`} placeholder="Açıklama..." />
                                    <div className="flex flex-col items-center">
                                        <label className="text-[10px] text-slate-400 mb-0.5">Maks</label>
                                        <input type="number" step="5" value={item.max} onChange={e => setItems(prev => prev.map((it, i) => i === idx ? { ...it, max: Number(e.target.value) || 0 } : it))} className={`w-16 p-1.5 text-center bg-slate-700 border border-slate-600 rounded-md font-bold text-amber-400 ${focusClasses}`} />
                                    </div>
                                    <button onClick={() => setItems(prev => prev.filter((_, i) => i !== idx))} className="mt-4 p-2 text-red-400 hover:bg-red-500/20 rounded-md text-xs font-bold">Sil</button>
                                </div>
                            ))}
                            <button onClick={() => setItems(prev => [...prev, { id: 'krit_' + Date.now(), label: 'Yeni ölçüt...', max: 20 }])} className="w-full py-2.5 border-2 border-dashed border-slate-600 hover:border-blue-500 text-blue-400 rounded-lg font-semibold text-sm">+ Yeni Kriter Ekle</button>
                        </div>
                        <div className="p-5 border-t border-slate-700 bg-slate-800/90 flex flex-wrap justify-between items-center gap-3">
                            <button onClick={() => onCopyCriteriaToAll(items)} className="py-2 px-4 bg-indigo-600/80 hover:bg-indigo-600 text-white rounded-lg text-sm font-semibold">Tüm Sınıflara Uygula</button>
                            <div className="flex gap-3">
                                <button onClick={onClose} className="py-2 px-5 bg-slate-600 text-white rounded-lg text-sm">Vazgeç</button>
                                <button onClick={() => onSaveCriteria(items)} className="py-2 px-5 bg-green-600 text-white rounded-lg font-bold text-sm">Kaydet</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 0, 5, 10, 15, 20 şeklinde beşer beşer artan puanlama modalı
        const DynamicSpeakingExamModal = memo(({ student, criteria, scores, onSave, onClose, onScoreChange, examNumber, className }) => {
            const totalScore = criteria.reduce((sum, c) => sum + (Number(scores[c.id]) || 0), 0);
            const maxPossible = criteria.reduce((sum, c) => sum + (Number(c.max) || 0), 0);

            // 0'dan maks puana kadar 5'er 5'er dizi üretir (Örn: [0, 5, 10, 15, 20])
            const getFiveStepOptions = (maxVal) => {
                const steps = [];
                for (let val = 0; maxVal >= val; val += 5) {
                    steps.push(val);
                }
                if (steps.length === 0 || steps[steps.length - 1] !== maxVal) {
                    steps.push(maxVal);
                }
                return steps;
            };

            return (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 fade-in">
                    <div className="bg-slate-800 rounded-xl shadow-2xl border border-slate-700 w-full max-w-3xl flex flex-col max-h-[90vh]">
                        <div className="p-5 border-b border-slate-700 flex justify-between items-center">
                            <h3 className="text-xl font-bold text-white">
                                {examNumber}. Konuşma Sınavı ({className}): <span className="text-blue-400">{student.schoolNumber ? `[${student.schoolNumber}] ` : ''}{student.name}</span>
                            </h3>
                            <button onClick={() => criteria.forEach(c => onScoreChange(c.id, Number(c.max) || 0))} className="text-xs bg-emerald-600/30 border border-emerald-500 text-emerald-300 px-3 py-1.5 rounded-md hover:bg-emerald-600/50 font-semibold">Tümüne Tam Puan</button>
                        </div>
                        <div className="p-5 overflow-y-auto space-y-3 flex-1">
                            {criteria.map((c, idx) => {
                                const maxVal = Number(c.max) || 20;
                                const stepOptions = getFiveStepOptions(maxVal);
                                const currentVal = scores[c.id] !== undefined && scores[c.id] !== null ? Number(scores[c.id]) : null;
                                return (
                                    <div key={c.id} className="p-3.5 bg-slate-900/50 rounded-lg border border-slate-700/60 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                        <div className="flex-1">
                                            <span className="text-xs font-bold text-sky-400 mr-2">Kriter {idx + 1} ({maxVal} Puan):</span>
                                            <span className="text-slate-200 text-sm">{c.label}</span>
                                        </div>
                                        <div className="flex flex-wrap items-center gap-1.5 self-end sm:self-center shrink-0">
                                            {stepOptions.map(pt => {
                                                const isSelected = currentVal === pt;
                                                let activeColor = 'bg-blue-600 border-blue-400 text-white';
                                                if (pt === 0) activeColor = 'bg-red-600 border-red-400 text-white';
                                                else if (pt === maxVal) activeColor = 'bg-green-600 border-green-400 text-white';
                                                return (
                                                    <button
                                                        key={pt}
                                                        type="button"
                                                        onClick={() => onScoreChange(c.id, pt)}
                                                        className={`w-10 py-1.5 rounded text-xs font-bold border transition-colors ${isSelected ? activeColor : 'bg-slate-700 border-slate-600 text-slate-300 hover:bg-slate-600'}`}
                                                    >
                                                        {pt}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                        <div className="p-5 border-t border-slate-700 flex justify-between items-center bg-slate-800/90">
                            <div className="text-white font-bold text-lg">Toplam Puan: <span className="text-green-400 text-2xl">{totalScore}</span> / {maxPossible}</div>
                            <div className="flex gap-3">
                                <button onClick={onClose} className="py-2 px-5 bg-slate-600 text-white rounded-lg text-sm">Kapat</button>
                                <button onClick={onSave} className="py-2 px-6 bg-blue-600 text-white rounded-lg font-bold text-sm">Kaydet</button>
                            </div>
                        </div>
                    </div>
                </div>

            useEffect(() => {

            const handleEokulPdfUpload = async (e, targetClassId = null) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsParsingPdf(true);
                setPdfStatusMsg('PDF analiz ediliyor...');

                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let extractedStudents = [];
                    let detectedClassName = '';

                    const blacklist = [
                        'OKUL', 'KURUM', 'DÖNEM', 'PUAN', 'ÇİZELGESİ', 'ÖĞRENCİ', 'SINAVLAR',
                        'YAZILI', 'PERFORMANS', 'UYGULAMA', 'PROJE', 'MUAF', 'NUMARASI', 'SIRA',
                        'ADI SOYADI', 'DERS', 'ÖĞRETMENİ', 'MÜDÜR', 'YARDIMCISI', 'DEVAMSIZLIKTAN',
                        'BAŞARISIZ', 'SAYILAN', 'ALANI', 'DALI', 'ŞUBESİ', 'SAATİ', 'HAFTALIK',
                        'TÜRK DİLİ', 'EDEBİYATI', 'İSTANBUL', 'ANADOLU', 'LİSESİ', 'CE-OKUL'
                    ];

                    for (let pageNum = 1; pdf.numPages >= pageNum; pageNum++) {
                        const page = await pdf.getPage(pageNum);
                        const textContent = await page.getTextContent();
                        const fullPageText = textContent.items.map(i => i.str).join(' ');

                        if (!detectedClassName) {
                            const clsMatch = fullPageText.match(/(\d+)\.\s*Sınıf\s*\/\s*([A-ZÇĞİÖŞÜ])\s*Şubesi/i);
                            if (clsMatch) {
                                detectedClassName = `${clsMatch[1]}-${clsMatch[2].toUpperCase()}`;
                            }
                        }

                        const rows = [];
                        textContent.items.forEach(item => {
                            const str = item.str.trim();
                            if (!str) return;
                            const y = item.transform[5];
                            const x = item.transform[4];
                            let row = rows.find(r => 4 > Math.abs(r.y - y));
                            if (!row) {
                                row = { y, items: [] };
                                rows.push(row);
                            }
                            row.items.push({ x, str });
                        });

                        rows.sort((a, b) => b.y - a.y);

                        rows.forEach(row => {
                            row.items.sort((a, b) => a.x - b.x);
                            const lineText = row.items.map(i => i.str).join(' ').replace(/\|/g, ' ').replace(/\s+/g, ' ').trim();
                            const matchTwoNums = lineText.match(/^(\d+)\s+(\d+)\s+([A-ZÇĞİÖŞÜa-zçğıöşü\s]{3,})$/);
                            if (matchTwoNums) {
                                const n1 = parseInt(matchTwoNums[1], 10);
                                const n2 = parseInt(matchTwoNums[2], 10);
                                const rawName = matchTwoNums[3].replace(/\s+/g, ' ').trim();
                                const upperName = rawName.toLocaleUpperCase('tr-TR');
                                const isBlacklisted = blacklist.some(w => upperName.includes(w));

                                if (!isBlacklisted && rawName.includes(' ')) {
                                    const expectedSeq = extractedStudents.length + 1;
                                    let schoolNo = n1;
                                    if (n1 === expectedSeq && n2 !== expectedSeq) {
                                        schoolNo = n2;
                                    } else if (n2 === expectedSeq && n1 !== expectedSeq) {
                                        schoolNo = n1;
                                    } else if (60 >= n1 && n2 > 60) {
                                        schoolNo = n2;
                                    } else if (60 >= n2 && n1 > 60) {
                                        schoolNo = n1;
                                    } else {
                                        schoolNo = Math.max(n1, n2);
                                    }
                                    extractedStudents.push({ schoolNumber: String(schoolNo), name: upperName });
                                }
                            }
                        });
                    }

                    if (extractedStudents.length === 0) {
                        alert("PDF içerisinden öğrenci okunamadı. e-Okul Puan Çizelgesi formatında olduğundan emin olun.");
                        return;
                    }

                    const baseScoreVal = settings.baseScore;
                    const newStudentObjects = extractedStudents.map((st, idx) => ({
                        id: Date.now() + idx,
                        schoolNumber: st.schoolNumber,
                        name: st.name,
                        notes: '',
                        scores: { donem1: { ...defaultScores }, donem2: { ...defaultScores } },
                        assessments: {
                            donem1: { dersIciDurum: baseScoreVal, yazma1: null, yazma2: null, kitap1: null, kitap2: null },
                            donem2: { dersIciDurum: baseScoreVal, yazma1: null, yazma2: null, kitap1: null, kitap2: null }
                        },
                        speakingExams: JSON.parse(JSON.stringify(newSpeakingExamStructure))
                    }));

                    const finalClassName = detectedClassName || file.name.replace(/\.pdf$/i, '').toUpperCase();

                    let updatedClasses = [...classes];
                    let selectedId = targetClassId;

                    if (!selectedId) {
                        const existingCls = updatedClasses.find(c => c.name.toLocaleUpperCase('tr-TR') === finalClassName.toLocaleUpperCase('tr-TR'));
                        if (existingCls) selectedId = existingCls.id;
                    }

                    if (selectedId) {
                        updatedClasses = updatedClasses.map(c => {
                            if (String(c.id) !== String(selectedId)) return c;
                            const existingNums = new Set(c.students.map(s => s.schoolNumber));
                            const filteredNew = newStudentObjects.filter(s => !existingNums.has(s.schoolNumber));
                            return { ...c, students: sortStudentsList([...c.students, ...filteredNew]) };
                        });
                        setActiveClassId(selectedId);
                    } else {
                        const newCls = {
                            id: Date.now(),
                            name: finalClassName,
                            students: sortStudentsList(newStudentObjects),
                            bookTitles: JSON.parse(JSON.stringify(newBookTitleStructure)),
                            speakingCriteria: isNinth ? NINTH_GRADE_SPEAKING_PRESET : DEFAULT_SPEAKING_PRESET
                        };
                        updatedClasses.push(newCls);
                        setActiveClassId(newCls.id);
                    }

                    setClasses(updatedClasses);
                    db.collection('userData').doc(user.uid).set({ classes: updatedClasses }, { merge: true });
                    setPdfStatusMsg(`${finalClassName} başarıyla yüklendi!`);
                    setTimeout(() => setPdfStatusMsg(''), 4000);
                } catch (err) {
                    console.error("PDF okuma hatası:", err);
                    alert("PDF okunurken hata oluştu: " + err.message);
                } finally {
                    setIsParsingPdf(false);
                    e.target.value = '';

            const handleSaveClassCriteria = (newCriteriaList) => {

            const handleGenerateDynamicSpeakingSummaryReport = (semester) => {
                if (!activeClass) return;
                setIsGeneratingPdf(true);
                const donemKey = semester === 1 ? 'donem1' : 'donem2';
                const students = activeClass.students;
                const criteria = getClassSpeakingCriteria(activeClass);
                const studentsPerPage = 15;
                const numPages = Math.ceil(students.length / studentsPerPage);

                const criteriaHeaders = () => criteria.map((c, i) => `<th style="border: 1px solid #333; padding: 4px; font-size: 8px;">K.${i + 1}<br/>(${c.max}p)</th>`).join('');
                const criteriaNotes = criteria.map((c, i) => `<li><b>K.${i + 1} (${c.max} Puan):</b> ${c.label}</li>`).join('');

                for (let i = 0; numPages > i; i++) {
                    const chunk = students.slice(i * studentsPerPage, (i + 1) * studentsPerPage);

                        const globalIndex = i * studentsPerPage + idx + 1;
                        const s1 = student.speakingExams?.[donemKey]?.sinav1 || {};
                        const s2 = student.speakingExams?.[donemKey]?.sinav2 || {};
                        const t1 = criteria.reduce((sum, c) => sum + (Number(s1[c.id]) || 0), 0);
                        const t2 = criteria.reduce((sum, c) => sum + (Number(s2[c.id]) || 0), 0);
                        const ort = (t1 > 0 || t2 > 0) ? Math.round((t1 + t2) / ((t1 > 0 ? 1 : 0) + (t2 > 0 ? 1 : 0))) : '-';
                        const cells = (scores) => criteria.map(c => `<td style="border: 1px solid #ccc; padding: 4px; font-size: 8.5px;">${scores[c.id] ?? '-'}</td>`).join('');

                }
                const container = document.createElement('div'); container.style.position = 'absolute'; container.style.left = '-9999px'; container.style.width = '210mm';

                const { jsPDF } = window.jspdf;

                    window.html2canvas(pages[idx], { scale: 2, useCORS: true }).then(canvas => { if (idx > 0) pdf.addPage(); pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 210, 297, undefined, 'FAST'); process(idx + 1); });

            const handleGenerateBookReport = (semester) => {
                if (!tempClassData) return;

                setNewStudentNumber('');

                const newStudents = lines.map((line, index) => {
                    let cleanLine = line.replace(/\|/g, ' ').replace(/\s+/g, ' ').trim();
                    let schoolNo = '';
                    let studentName = cleanLine;
                    const m2 = cleanLine.match(/^(\d+)\s+(\d+)\s+(.+)$/);
                    const m1 = cleanLine.match(/^(\d+)[\.\-\s]+(.+)$/);
                    if (m2) {
                        const n1 = parseInt(m2[1], 10);
                        const n2 = parseInt(m2[2], 10);
                        schoolNo = String(60 >= n1 && n2 > 60 ? n2 : (60 >= n2 && n1 > 60 ? n1 : Math.max(n1, n2)));
                        studentName = m2[3].trim();
                    } else if (m1) {
                        schoolNo = m1[1].trim();
                        studentName = m1[2].trim();
                    }
                    return {
                        id: Date.now() + index,
                        schoolNumber: schoolNo,
                        name: studentName.replace(/\s+/g, ' ').trim().toLocaleUpperCase('tr-TR'),
                        notes: '',
                        scores: { donem1: { ...defaultScores }, donem2: { ...defaultScores } },

                            donem1: { dersIciDurum: baseScoreVal, yazma1: null, yazma2: null, kitap1: null, kitap2: null },

            const calculateGrade = useCallback((scores) => { 
                if (!scores) return settings.baseScore; 
                const score = settings.baseScore +
                    ((Number(scores.inClassPlus) || 0) * settings.inClassPlus) +
                    ((Number(scores.inClassMinus) || 0) * settings.inClassMinus) +
                    ((Number(scores.homeworkPlus) || 0) * settings.homeworkPlus) +
                    ((Number(scores.homeworkMinus) || 0) * settings.homeworkMinus); 
                return Math.max(0, Math.min(100, score)); 
            }, [settings]);
            
            const handleManualScoreChange = useCallback((studentId, scoreType, value) => {
                if (!activeClass) return;
                const scoreToSet = value === '' ? 0 : Math.max(0, Number(value));
                const donemKey = activeSemester === 1 ? 'donem1' : 'donem2';
                setClasses(prevClasses => prevClasses.map(c => {
                    if (String(c.id) !== String(activeClass.id)) return c;
                    return {
                        ...c,
                        students: c.students.map(s => {
                            if (s.id !== studentId) return s;
                            const currentScores = s.scores[donemKey] || defaultScores;
                            const newScores = { ...currentScores, [scoreType]: scoreToSet };
                            const newGrade = calculateGrade(newScores);
                            const newAssessments = { ...s.assessments };
                            newAssessments[donemKey].dersIciDurum = newGrade;
                            return { ...s, scores: { ...s.scores, [donemKey]: newScores }, assessments: newAssessments };
                        })
                    };
                }));
            }, [activeClass, activeSemester, calculateGrade]);

            const updateStudentScore = useCallback((studentId, scoreType) => {
                if (!activeClass) return;
                setUndoMessage('');
                setLastAction({ studentId, scoreType, classId: activeClass.id, semester: activeSemester });
                const donemKey = activeSemester === 1 ? 'donem1' : 'donem2';
                setClasses(prevClasses => prevClasses.map(c => {
                    if (String(c.id) !== String(activeClass.id)) return c;
                    return {
                        ...c,
                        students: c.students.map(s => {
                            if (s.id !== studentId) return s;
                            const currentScores = s.scores[donemKey] || defaultScores;
                            const newScores = { ...currentScores, [scoreType]: (Number(currentScores[scoreType]) || 0) + 1 };
                            const newGrade = calculateGrade(newScores);
                            const newAssessments = { ...s.assessments };
                            newAssessments[donemKey].dersIciDurum = newGrade;
                            return { ...s, scores: { ...s.scores, [donemKey]: newScores }, assessments: newAssessments };

            const handleSaveNote = (studentId, newNote) => {

                setClasses(prev => prev.map(c => String(c.id) !== String(activeClass.id) ? c : {
                    ...c,
                    students: c.students.map(s => s.id === studentId ? { ...s, notes: newNote } : s)
                }));
                setEditingNoteStudent(null);
            };
            
            const handleUndoLastAction = () => { 
                if (!lastAction) return; 
                const { studentId, scoreType, classId, semester } = lastAction; 
                const donemKey = semester === 1 ? 'donem1' : 'donem2'; 
                let studentName = ''; 
                setClasses(prev => prev.map(c => { 
                    if (String(c.id) !== String(classId)) return c; 
                    return { ...c, students: c.students.map(s => { 
                        const currentScores = s.scores[donemKey] || defaultScores;
                        if (s.id === studentId && currentScores[scoreType] > 0) { 
                            studentName = s.name; 
                            const newScores = { ...currentScores, [scoreType]: currentScores[scoreType] - 1 }; 
                            const newGrade = calculateGrade(newScores);
                            const newAssessments = { ...s.assessments };
                            newAssessments[donemKey].dersIciDurum = newGrade;
                            return { ...s, scores: { ...s.scores, [donemKey]: newScores }, assessments: newAssessments }; 
                        } 
                        return s; 
                    })}; 
                })); 
                setUndoMessage(`${studentName} isimli öğrencinin son puanı geri alındı.`); 
                setLastAction(null); 
                setTimeout(() => setUndoMessage(''), 3000); 
            };

            const distributeScores = (totalScore, criteria) => { 
                let distributed = {}; let currentTotal = 0; 
                const scoresWithDiff = Object.entries(criteria).map(([key, { max }]) => { 
                    const rawScore = (totalScore / 100) * max; 
                    const roundedScore = Math.round(rawScore); 
                    currentTotal += roundedScore; 
                    return { key, max, rounded: roundedScore, diff: roundedScore - rawScore }; 
                }); 
                let difference = totalScore - currentTotal; 
                scoresWithDiff.sort((a, b) => a.diff - b.diff); 
                while (difference !== 0) { 
                    for (const item of scoresWithDiff) { 
                        if (difference === 0) break; 
                        if (difference > 0 && item.max > item.rounded) { item.rounded++; difference--; } 
                        else if (0 > difference && item.rounded > 0) { item.rounded--; difference++; } 
                    } 
                } 
                scoresWithDiff.forEach(item => { distributed[item.key] = item.rounded; }); 
                return distributed; 
            };

                                </div>
