        const SPEAKING_EXAM_CRITERIA = {

        const SPEAKING_EXAM_9TH_CRITERIA = {
            planlama: { label: "Planlama", max: 15, details: ["Konuşmaya etkili bir giriş yapmış, konuşmayı sürdürmüş ve etkili bir şekilde tamamlamıştır.", "Görüşlerine uygun örnekler sunmuştur."] },

            akicilik: { label: "Akıcılık", max: 20, details: ["İşitilebilir bir ses tonuyla konuşmuştur.", "Gereksiz ses tekrarına düşmeden akıcı bir şekilde konuşmuştur.", "Vurgu ve tonlamaya dikkat ederek konuşmuştur."] },
            bedenDili: { label: "Beden Dili", max: 15, details: ["Sunumda jest ve mimiklerini etkili kullanmış, dinleyicilerle yeterli göz temasını kurmuştur."] },
            isBirligi: { label: "İş Birliği", max: 10, details: ["Grup çalışmalarında üzerine düşen sorumlulukları yerine getirmiştir."] }
        };

        // 1. Performans Notu Hesaplama (%50 Ders İçi Durum, %50 Yazma Görevleri Ortalaması)
        const calculateWeightedPerf1 = (assessment) => {
            if (!assessment) return null;
            const d = assessment.dersIciDurum;
            const y1 = assessment.yazma1;
            const y2 = assessment.yazma2;

            const hasD = d !== null && d !== undefined && d !== '' && !isNaN(d);
            const hasY1 = y1 !== null && y1 !== undefined && y1 !== '' && !isNaN(y1);
            const hasY2 = y2 !== null && y2 !== undefined && y2 !== '' && !isNaN(y2);

            if (!hasD && !hasY1 && !hasY2) return null;

            let score = 0;
            let weightSum = 0;

            if (hasD) {
                score += Number(d) * 0.5;
                weightSum += 0.5;
            }

            if (hasY1 || hasY2) {
                const ySum = (hasY1 ? Number(y1) : 0) + (hasY2 ? Number(y2) : 0);
                const yCount = (hasY1 ? 1 : 0) + (hasY2 ? 1 : 0);
                const yAvg = ySum / yCount;
                score += yAvg * 0.5;
                weightSum += 0.5;
            }

            return weightSum > 0 ? Math.round(score / weightSum) : null;
        };

        // Öğrenci Sıralama Fonksiyonu (Okul Numarasına Göre, Yoksa İsme Göre)
        const sortStudentsList = (students) => {
            return [...students].sort((a, b) => {
                const numA = parseInt(a.schoolNumber, 10);
                const numB = parseInt(b.schoolNumber, 10);
                if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
                if (!isNaN(numA)) return -1;
                if (!isNaN(numB)) return 1;
                return (a.name || '').localeCompare(b.name || '', 'tr');
            });
        };

        // İkonlar
        const EditIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>;
        const XIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;

        const MicIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg>;
        const SearchIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>;
        const PlusIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const MinusIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const UploadCloudIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>;
        const DownloadIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
        const NoteIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>;
        const SettingsIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51h.09a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
        const ClassesIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6"/><path d="M23 11h-6"/></svg>;
        const SaveIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;
        const TrashIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;

        const LogOutIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>;
        const BookIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>;
        
        const focusClasses = "focus:outline-none focus:ring-2 focus:ring-blue-500";

        function AuthScreen() {
            const [email, setEmail] = useState(''); const [password, setPassword] = useState(''); const [isLogin, setIsLogin] = useState(true); const [error, setError] = useState(''); const [loading, setLoading] = useState(false);
            const handleSubmit = (e) => { e.preventDefault(); setError(''); setLoading(true); if (isLogin) { auth.signInWithEmailAndPassword(email, password).catch(err => setError(err.message)).finally(() => setLoading(false)); } else { auth.createUserWithEmailAndPassword(email, password).catch(err => setError(err.message)).finally(() => setLoading(false)); } };
            return ( <div className="bg-slate-800/50 backdrop-blur-sm border border-slate-700 rounded-2xl shadow-2xl shadow-blue-500/10 p-8 text-white w-full max-w-md mx-auto auth-form"> <h1 className="cool-title text-4xl font-bold text-center mb-8">Performans Paneli</h1> <h2 className="text-2xl font-bold text-center mb-6">{isLogin ? 'Giriş Yap' : 'Kayıt Ol'}</h2> <form onSubmit={handleSubmit} className="space-y-6"> <div><label className="block text-sm font-medium text-slate-400">E-posta Adresi</label><input type="email" value={email} onChange={e => setEmail(e.target.value)} required className={`w-full mt-1 p-2 bg-slate-700 border border-slate-600 rounded-md text-white ${focusClasses}`}/></div> <div><label className="block text-sm font-medium text-slate-400">Şifre</label><input type="password" value={password} onChange={e => setPassword(e.target.value)} required className={`w-full mt-1 p-2 bg-slate-700 border border-slate-600 rounded-md text-white ${focusClasses}`}/></div> {error && <p className="text-red-400 text-sm text-center">{error}</p>} <button type="submit" disabled={loading} className="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 disabled:bg-slate-500">{loading ? 'İşleniyor...' : (isLogin ? 'Giriş Yap' : 'Kayıt Ol')}</button> </form> <p className="text-center text-slate-400 mt-6">{isLogin ? "Hesabınız yok mu? " : "Zaten bir hesabınız var mı? "}<button onClick={() => setIsLogin(!isLogin)} className="font-semibold text-blue-400 hover:underline">{isLogin ? 'Kayıt Olun' : 'Giriş Yapın'}</button></p> </div> );
        }
        
        const StudentAssessmentCard = memo(({ student, index, semester, onScoreChange }) => {
            const donemKey = semester === 1 ? 'donem1' : 'donem2';
            const assessment = student.assessments?.[donemKey] || {};
            
            const calculatePerf1 = () => {
                const val = calculateWeightedPerf1(assessment);
                return val === null ? '-' : val;
            };

            const calculatePerf2 = () => {
                const notes = [assessment.kitap1, assessment.kitap2];
                const validNotes = notes.filter(n => n !== null && n !== undefined && n !== '' && !isNaN(n));
                if (validNotes.length === 0) return '-';
                const sum = validNotes.reduce((acc, n) => acc + Number(n), 0);
                return Math.round(sum / validNotes.length);
            };

            const perf1 = calculatePerf1();
            const perf2 = calculatePerf2();
            
            const NoteInput = ({ type, label }) => {
                const [val, setVal] = useState(assessment[type] === null || assessment[type] === undefined ? '' : assessment[type]);
                useEffect(() => {
                    setVal(assessment[type] === null || assessment[type] === undefined ? '' : assessment[type]);
                }, [assessment[type]]);

                const handleChange = (e) => setVal(e.target.value);
                const handleBlur = (e) => onScoreChange(student.id, donemKey, type, e.target.value);

                return (
                    <div className="flex justify-between items-center space-x-2"> 
                        <label className="text-slate-400">{label}</label> 
                        <input type="number" value={val} onChange={handleChange} onBlur={handleBlur} className={`w-20 p-1.5 text-center bg-slate-700 rounded-md ${focusClasses}`} /> 
                    </div>
                );
            };

            return (
                <div className="bg-slate-800/50 rounded-lg p-4">
                    <h4 className="font-bold text-lg text-green-300 mb-3 p-2 border border-green-500 rounded-md bg-green-500/10">
                        <span className="text-slate-400 mr-2">{index + 1}.</span>
                        {student.schoolNumber && <span className="text-amber-400 mr-2">[{student.schoolNumber}]</span>}
                        {student.name}
                    </h4>
                    <div className="flex flex-col md:flex-row gap-4">
                        <div className="flex-1 space-y-2 p-3 bg-slate-900/40 rounded-md">
                            <div className="flex justify-between items-center border-b border-slate-700 pb-2 mb-2">
                                <span className="font-bold text-sky-400">1. Performans Notu</span>
                                <span className="font-bold text-xl text-sky-400">{perf1}</span>
                            </div>
                            <NoteInput type="dersIciDurum" label="Ders İçi Durum (%50)" />
                            <NoteInput type="yazma1" label="1. Yazma Görevi (%25)" />
                            <NoteInput type="yazma2" label="2. Yazma Görevi (%25)" />
                        </div>
                        <div className="flex-1 space-y-2 p-3 bg-slate-900/40 rounded-md">
                            <div className="flex justify-between items-center border-b border-slate-700 pb-2 mb-2">
                                <span className="font-bold text-sky-400">2. Performans Notu</span>
                                <span className="font-bold text-xl text-sky-400">{perf2}</span>
                            </div>
                            <NoteInput type="kitap1" label="1. Kitap Sınavı" />
                            <NoteInput type="kitap2" label="2. Kitap Sınavı" />
                        </div>
                    </div>
                </div>
            );
        });

        const SemesterCard = ({ semester, students, bookTitles, onScoreChange, onBookTitleChange, onSave, onGenerateReport, onGenerateBookReport }) => {

            // e-Okul PDF Dosyasından Öğrenci Numarası ve İsimlerini Otomatik Çekme
            const handlePdfStudentUpload = async (e) => {
                const file = e.target.files[0];
                if (!file || !activeClassId) return;
                setIsParsingPdf(true);
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let extractedStudents = [];
                    const blacklist = [
                        'OKUL', 'KURUM', 'DÖNEM', 'PUAN', 'ÇİZELGESİ', 'ÖĞRENCİ', 'SINAVLAR', 
                        'YAZILI', 'PERFORMANS', 'UYGULAMA', 'PROJE', 'MUAF', 'NUMARASI', 'SIRA', 
                        'ADI SOYADI', 'DERS', 'ÖĞRETMENİ', 'MÜDÜR', 'YARDIMCISI', 'DEVAMSIZLIKTAN', 
                        'BAŞARISIZ', 'SAYILAN', 'ALANI', 'DALI', 'ŞUBESİ', 'SAATİ', 'HAFTALIK', 
                        'TÜRK DİLİ', 'EDEBİYATI', 'İSTANBUL', 'ANADOLU', 'LİSESİ', 'CE-OKUL'
                    ];

                    for (let pageNum = 1; pdf.numPages >= pageNum; pageNum++) {
                        const page = await pdf.getPage(pageNum);
                        const textContent = await page.getTextContent();
                        const items = textContent.items;

                        // Y koordinatına göre satırları grupla (tolerance: 4px)
                        const rows = [];
                        items.forEach(item => {
                            const str = item.str.trim();
                            if (!str) return;
                            const y = item.transform[5];
                            const x = item.transform[4];
                            let row = rows.find(r => 4 > Math.abs(r.y - y));
                            if (!row) {
                                row = { y, items: [] };
                                rows.push(row);
                            }
                            row.items.push({ x, str });
                        });

                        // Satırları yukarıdan aşağıya sırala
                        rows.sort((a, b) => b.y - a.y);

                        rows.forEach(row => {
                            // Satır içi öğeleri soldan sağa sırala
                            row.items.sort((a, b) => a.x - b.x);
                            const lineText = row.items.map(i => i.str).join(' ').replace(/\|/g, ' ').replace(/\s+/g, ' ').trim();
                            
                            // Örn: "434 1 MUHAMMED ALSILES" veya "3 559 RAMAZAN AYAZ"
                            const matchTwoNums = lineText.match(/^(\d+)\s+(\d+)\s+([A-ZÇĞİÖŞÜa-zçğıöşü\s]{3,})$/);
                            if (matchTwoNums) {
                                const n1 = parseInt(matchTwoNums[1], 10);
                                const n2 = parseInt(matchTwoNums[2], 10);
                                const rawName = matchTwoNums[3].trim();
                                const upperName = rawName.toLocaleUpperCase('tr-TR');
                                const isBlacklisted = blacklist.some(w => upperName.includes(w));
                                
                                if (!isBlacklisted && rawName.includes(' ')) {
                                    let schoolNo = n1;
                                    // e-Okul listesinde sıra no (1-60 arası) ile okul no yer değiştirebilir
                                    if (60 >= n1 && n2 > 60) {
                                        schoolNo = n2;
                                    } else if (60 >= n2 && n1 > 60) {
                                        schoolNo = n1;
                                    } else {
                                        schoolNo = Math.max(n1, n2);
                                    }
                                    extractedStudents.push({ schoolNumber: String(schoolNo), name: rawName });
                                }
                            }
                        });
                    }

                    if (extractedStudents.length === 0) {
                        alert("PDF içerisinden öğrenci listesi okunamadı. Lütfen geçerli bir e-Okul Puan Çizelgesi PDF dosyası seçtiğinizden emin olun.");
                    } else {
                        const baseScoreVal = settings.baseScore;
                        const newStudents = extractedStudents.map((st, idx) => ({
                            id: Date.now() + idx,
                            schoolNumber: st.schoolNumber,
                            name: st.name,
                            notes: '',
                            scores: { donem1: { ...defaultScores }, donem2: { ...defaultScores } },
                            assessments: {
                                donem1: { dersIciDurum: baseScoreVal, yazma1: null, yazma2: null, kitap1: null, kitap2: null },
                                donem2: { dersIciDurum: baseScoreVal, yazma1: null, yazma2: null, kitap1: null, kitap2: null }
                            },
                            speakingExams: JSON.parse(JSON.stringify(newSpeakingExamStructure)),

                            donem1: { dersIciDurum: baseScoreVal, yazma1: null, yazma2: null, kitap1: null, kitap2: null },
                            donem2: { dersIciDurum: baseScoreVal, yazma1: null, yazma2: null, kitap1: null, kitap2: null }

                            if (!scores) return newSettings.baseScore;

                                (scores.inClassPlus * newSettings.inClassPlus) + 
                                (scores.inClassMinus * newSettings.inClassMinus) +

                                            {activeClass.students.map((student, index) => {
                                                const donemKey = activeSemester === 1 ? 'donem1' : 'donem2';
                                                const totalScore1 = student.speakingExams[donemKey]?.sinav1 ? Object.values(student.speakingExams[donemKey].sinav1).reduce((sum, score) => sum + (Number(score) || 0), 0) : 0;
                                                const totalScore2 = student.speakingExams[donemKey]?.sinav2 ? Object.values(student.speakingExams[donemKey].sinav2).reduce((sum, score) => sum + (Number(score) || 0), 0) : 0;
                                                return(
                                                <div key={student.id} className="bg-slate-800/50 rounded-lg p-4">
                                                    <h4 className="font-medium text-lg text-white mb-3">
                                                        <span className="text-slate-500 mr-2">{index + 1}.</span>
                                                        {student.schoolNumber && <span className="text-amber-400 mr-2">[{student.schoolNumber}]</span>}
                                                        {student.name}
                                                    </h4>
                                                    <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4">
                                                        <div className="flex-1 flex justify-between items-center bg-slate-900/40 p-3 rounded-md">
                                                            <span>1. Konuşma Sınavı: <span className="font-bold text-xl text-amber-400">{totalScore1}</span></span>
                                                            <button onClick={() => handleOpenSpeakingExamModal(student, activeSemester, 1)} className="bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2 px-3 rounded-md text-sm">Değerlendir</button>
                                                        </div>
                                                         <div className="flex-1 flex justify-between items-center bg-slate-900/40 p-3 rounded-md">
                                                             <span>2. Konuşma Sınavı: <span className="font-bold text-xl text-amber-400">{totalScore2}</span></span>
                                                             <button onClick={() => handleOpenSpeakingExamModal(student, activeSemester, 2)} className="bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2 px-3 rounded-md text-sm">Değerlendir</button>
                                                         </div>
                                                    </div>
                                                </div>
                                                )})}
                                         </div>
                                     </div>
                                 ) : <div className="text-center py-10"><h2 className="text-2xl font-bold text-slate-300">Lütfen İşlem Yapmak İçin Bir Sınıf Seçin</h2></div>}
                             </div>
                        )}
                        
                        {activeView === 'assessments' && (
                            <div className="confirm-modal">
                                <div className="mb-6"><h2 className="text-xl font-bold text-slate-100 mb-3">Sınıf Seçimi</h2><div className="flex flex-wrap gap-2 border-b-2 border-slate-700 pb-4">{classes.length > 0 ? classes.map(c => <div key={c.id} className="relative"><button onClick={() => handleSetActiveClassId(c.id)} className={`py-2 px-4 rounded-md ${activeClassId === c.id ? 'bg-blue-600 font-bold' : 'bg-slate-700 hover:bg-slate-600 text-white'}`}>{c.name} ({c.students.length})</button></div>) : <p className="text-slate-400">Lütfen önce bir sınıf ekleyin.</p>}</div></div>
                                {tempClassData ? (
                                    <div>
                                        <div className="relative mb-6">
                                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><SearchIcon /></div>
                                            <input type="text" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} placeholder="Öğrenci adı veya okul numarası ile ara..." className={`w-full p-2 pl-10 bg-slate-800 border border-slate-600 rounded-md text-white ${focusClasses}`}/>
                                            {searchTerm && (<button onClick={() => setSearchTerm('')} className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-white"><XIcon/></button>)}
                                        </div>
                                        <div className="flex border-b border-slate-700 mb-6">
                                            <button onClick={() => setActiveSemester(1)} className={`py-2 px-4 font-semibold rounded-t-lg transition-colors ${activeSemester === 1 ? 'bg-slate-800 border-b-2 border-blue-500 text-white' : 'text-slate-400 hover:bg-slate-800/50'}`}>1. Dönem</button>
                                            <button onClick={() => setActiveSemester(2)} className={`py-2 px-4 font-semibold rounded-t-lg transition-colors ${activeSemester === 2 ? 'bg-slate-800 border-b-2 border-blue-500 text-white' : 'text-slate-400 hover:bg-slate-800/50'}`}>2. Dönem</button>
                                        </div>
                                        {activeSemester === 1 && <SemesterCard semester={1} students={filteredStudents(tempClassData.students)} bookTitles={tempClassData.bookTitles?.donem1} onScoreChange={handleTempScoreChange} onBookTitleChange={handleTempBookTitleChange} onSave={handleSaveAssessments} onGenerateReport={() => handleGenerateSemesterReport(1)} onGenerateBookReport={() => handleGenerateBookReport(1)} />}
                                        {activeSemester === 2 && <SemesterCard semester={2} students={filteredStudents(tempClassData.students)} bookTitles={tempClassData.bookTitles?.donem2} onScoreChange={handleTempScoreChange} onBookTitleChange={handleTempBookTitleChange} onSave={handleSaveAssessments} onGenerateReport={() => handleGenerateSemesterReport(2)} onGenerateBookReport={() => handleGenerateBookReport(2)} />}
                                    </div>
                                ) : <div className="text-center py-10"><h2 className="text-2xl font-bold text-slate-300">Lütfen İşlem Yapmak İçin Bir Sınıf Seçin</h2></div>}
                            </div>
                        )}

                        {activeView === 'classes' && (
                            <div>
                                <div className="mb-6"><h2 className="text-xl font-bold text-slate-100 mb-3">Sınıf Yönetimi</h2><div className="flex gap-2 mb-4"><input type="text" value={newClassName} onChange={(e) => setNewClassName(e.target.value)} placeholder="Yeni Sınıf Adı (örn: 9-F)" className={`flex-grow p-2 bg-slate-700 border border-slate-600 rounded-md text-white ${focusClasses}`}/> <button onClick={handleAddClass} className="bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700">Ekle</button></div>{classes.length > 0 && <div className="flex flex-wrap gap-2 border-b-2 border-slate-700 pb-4">{classes.map(c => <div key={c.id} className="relative"><button onClick={() => handleSetActiveClassId(c.id)} className={`py-2 px-4 rounded-md ${activeClassId === c.id ? 'bg-blue-600 font-bold' : 'bg-slate-700 hover:bg-slate-600 text-white'}`}>{c.name} ({c.students.length})</button><button onClick={() => setClassToDelete(c)} className="absolute -top-2 -right-2 bg-red-500/80 text-white w-5 h-5 rounded-full flex items-center justify-center text-xs hover:bg-red-600">X</button></div>)}</div>}</div>
                                {activeClass ? (
                                    activeClass.students.length === 0 ? (
                                        <div className="bg-slate-900/50 border border-slate-700 rounded-lg p-6 space-y-6">
                                            <div>
                                                <h2 className="text-xl font-bold mb-2 text-white">1. Yöntem: e-Okul PDF Listesinden Otomatik Aktar ({activeClass.name})</h2>
                                                <p className="text-slate-400 text-sm mb-3">e-Okul Puan Çizelgesi PDF dosyasını seçin; okul numaraları ve öğrenci isimleri otomatik ayrıştırılır.</p>
                                                <label className="w-full flex items-center justify-center gap-2 bg-purple-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-purple-700 cursor-pointer transition-colors">
                                                    <UploadCloudIcon />
                                                    <span>{isParsingPdf ? 'PDF Okunuyor...' : 'e-Okul PDF Dosyası Seç ve Aktar'}</span>
                                                    <input type="file" accept="application/pdf" onChange={handlePdfStudentUpload} disabled={isParsingPdf} className="hidden" />
                                                </label>
                                            </div>
                                            <div className="border-t border-slate-700 pt-6">
                                                <h2 className="text-xl font-bold mb-2 text-white">2. Yöntem: Metin Olarak Yapıştır ({activeClass.name})</h2>
                                                <textarea value={listText} onChange={(e) => setListText(e.target.value)} placeholder={"434 MUHAMMED ALSILES\n500 BAHA KEREM KUDİŞ..."} className={`w-full h-32 p-3 bg-slate-700 border border-slate-600 rounded-md mb-4 text-white ${focusClasses}`}/>
                                                <button onClick={handleTextListSave} className="w-full flex items-center justify-center gap-2 bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700"><UploadCloudIcon /> Metin Listesini Oluştur</button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div>
                                            <div className="relative mb-6">
                                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><SearchIcon /></div>
                                                <input type="text" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} placeholder="Öğrenci adı veya okul numarası ile ara..." className={`w-full p-2 pl-10 bg-slate-800 border border-slate-600 rounded-md text-white ${focusClasses}`}/>
                                                 {searchTerm && (<button onClick={() => setSearchTerm('')} className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-white"><XIcon/></button>)}
                                            </div>
                                            
                                            <div className="flex border-b border-slate-700 mb-6">
                                                <button onClick={() => setActiveSemester(1)} className={`py-2 px-4 font-semibold rounded-t-lg transition-colors ${activeSemester === 1 ? 'bg-slate-800 border-b-2 border-blue-500 text-white' : 'text-slate-400 hover:bg-slate-800/50'}`}>1. Dönem</button>
                                                <button onClick={() => setActiveSemester(2)} className={`py-2 px-4 font-semibold rounded-t-lg transition-colors ${activeSemester === 2 ? 'bg-slate-800 border-b-2 border-blue-500 text-white' : 'text-slate-400 hover:bg-slate-800/50'}`}>2. Dönem</button>
                                            </div>

                                            <div className="hidden md:grid grid-cols-12 gap-4 font-bold text-slate-400 p-2 border-b-2 border-slate-700 mb-2"><div className="col-span-4">Öğrenci (Okul No - Ad Soyad)</div><div className="col-span-3 text-center">Sınıf İçi</div><div className="col-span-3 text-center">Ödev</div><div className="col-span-1 text-center">Notlar</div><div className="col-span-1 text-center">Sözlü Notu</div></div>
                                            <div className="space-y-2">{filteredStudents(activeClass.students).map((student) => (
                                                <StudentScoreRow
                                                    key={student.id}
                                                    student={student}
                                                    scores={student.scores[activeSemester === 1 ? 'donem1' : 'donem2'] || defaultScores}
                                                    index={activeClass.students.findIndex(s => s.id === student.id)}
                                                    onUpdateScore={updateStudentScore}
                                                    onManualChange={handleManualScoreChange}
                                                    onDelete={setStudentToDelete}
                                                    onOpenNotes={setEditingNoteStudent}
                                                    calculateGrade={calculateGrade}
                                                />
                                            ))}</div>
                                            <div className="mt-10 pt-6 border-t-2 border-slate-700">
                                                <h3 className="text-xl font-bold text-slate-100 mb-4">Öğrenci Yönetimi ({activeClass.name})</h3>
                                                <div className="flex flex-col sm:flex-row gap-2 mb-4">
                                                    <input type="text" value={newStudentNumber} onChange={(e) => setNewStudentNumber(e.target.value)} placeholder="Okul No (örn: 434)" className={`sm:w-40 p-2 bg-slate-700 border border-slate-600 rounded-md text-white ${focusClasses}`}/>
                                                    <input type="text" value={newStudentName} onChange={(e) => setNewStudentName(e.target.value)} placeholder="Yeni Öğrenci Adı Soyadı" className={`flex-grow p-2 bg-slate-700 border border-slate-600 rounded-md text-white ${focusClasses}`}/>
                                                    <button onClick={handleAddStudent} className="bg-green-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-green-700">Öğrenci Ekle</button>
                                                    <label className="flex items-center justify-center gap-2 bg-purple-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-purple-700 cursor-pointer">
                                                        <UploadCloudIcon />
                                                        <span>{isParsingPdf ? 'Yükleniyor...' : 'PDF İle Ekle'}</span>
                                                        <input type="file" accept="application/pdf" onChange={handlePdfStudentUpload} disabled={isParsingPdf} className="hidden" />
                                                    </label>
                                                </div>
                                            </div>
                                            <div className="flex flex-wrap justify-end items-center mt-8 gap-4">
                                                {undoMessage && <span className="text-green-400 teacher-info w-full text-right sm:w-auto">{undoMessage}</span>}
                                                <button onClick={handleUndoLastAction} disabled={!lastAction} className="flex items-center justify-center gap-2 bg-amber-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-amber-700 transition-colors disabled:bg-slate-700 disabled:text-slate-500 disabled:cursor-not-allowed"><UndoIcon/> Geri Al</button>
                                                <button onClick={handleGenerateSimplePdf} disabled={isGeneratingPdf} className="flex items-center justify-center gap-2 bg-slate-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-slate-500 transition-colors disabled:bg-slate-500 disabled:cursor-wait"><DownloadIcon/> {isGeneratingPdf ? 'Oluşturuluyor...' : 'Basit Rapor'}</button>
                                                <button onClick={handleGeneratePlusMinusReport} disabled={isGeneratingPdf} className="flex items-center justify-center gap-2 bg-teal-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-teal-700 transition-colors disabled:bg-slate-500 disabled:cursor-wait"><DownloadIcon/> {isGeneratingPdf ? 'Oluşturuluyor...' : 'Artı/Eksi Raporu'}</button>
                                                <button onClick={handleGenerateDetailedPdf} disabled={isGeneratingPdf} className="flex items-center justify-center gap-2 bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition-colors disabled:bg-slate-500 disabled:cursor-wait"><DownloadIcon/> {isGeneratingPdf ? 'Oluşturuluyor...' : 'Detaylı Rapor'}</button>
                                            </div>
                                        </div>
                                    )
                                ) : <div className="text-center py-10"><h2 className="text-2xl font-bold text-slate-300">Hoş Geldiniz!</h2><p className="text-slate-400">Başlamak için bir sınıf ekleyin veya Ayarlar menüsünü düzenleyin.</p></div>}
                            </div>
                        )}
                    </div>
                    {classToDelete && (<div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 confirm-modal"><div className="bg-slate-800 rounded-lg p-8 shadow-xl border border-slate-700 mx-4"><h3 className="text-xl font-bold text-white mb-4">Sınıfı Silme Onayı</h3><p className="text-slate-300 mb-6">"<span className="font-bold">{classToDelete.name}</span>" sınıfını ve tüm verileri <br/> kalıcı olarak silmek istediğinizden emin misiniz?</p><div className="flex justify-end gap-4"><button onClick={() => setClassToDelete(null)} className="py-2 px-5 bg-slate-600 text-white rounded-lg hover:bg-slate-500 font-semibold">Hayır, Vazgeç</button><button onClick={() => confirmDeleteClass(classToDelete.id)} className="py-2 px-5 bg-red-600 text-white rounded-lg hover:bg-red-700 font-bold">Evet, Sil</button></div></div></div>)}
                    {studentToDelete && (<div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 confirm-modal"><div className="bg-slate-800 rounded-lg p-8 shadow-xl border border-slate-700 mx-4"><h3 className="text-xl font-bold text-white mb-4">Öğrenci Silme Onayı</h3><p className="text-slate-300 mb-6">"<span className="font-bold">{studentToDelete.name}</span>" isimli öğrenciyi <br/> kalıcı olarak silmek istediğinizden emin misiniz?</p><div className="flex justify-end gap-4"><button onClick={() => setStudentToDelete(null)} className="py-2 px-5 bg-slate-600 text-white rounded-lg hover:bg-slate-500 font-semibold">Hayır, Vazgeç</button><button onClick={() => handleDeleteStudent(studentToDelete.id)} className="py-2 px-5 bg-red-600 text-white rounded-lg hover:bg-red-700 font-bold">Evet, Sil</button></div></div></div>)}
                    {editingNoteStudent && <NoteModal student={editingNoteStudent} onSave={handleSaveNote} onClose={() => setEditingNoteStudent(null)} />}
                    {evaluatingSpeaking && <SpeakingExamModal student={evaluatingSpeaking.student} semester={evaluatingSpeaking.semester} scores={evaluatingSpeaking.scores} onSave={handleSaveSpeakingExam} onClose={() => setEvaluatingSpeaking(null)} onScoreChange={handleSpeakingScoreChange} examNumber={evaluatingSpeaking.examNumber} />}
                    {evaluatingSpeaking9th && <SpeakingExam9thModal student={evaluatingSpeaking9th.student} scores={evaluatingSpeaking9th.scores} onSave={handleSaveSpeakingExam9th} onClose={() => setEvaluatingSpeaking9th(null)} onScoreChange={handleSpeaking9thScoreChange} examNumber={evaluatingSpeaking9th.examNumber} />}
                    {showScrollTop && (<button onClick={() => window.scrollTo({top: 0, behavior: 'smooth'})} className="fixed bottom-6 right-6 bg-blue-600 text-white p-3 rounded-full shadow-lg hover:bg-blue-700 transition-opacity z-50"><ArrowUpIcon /></button>)}
                </Fragment>
            );
        }

        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(user => {
                    setUser(user);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (loading) {
                return <div className="text-center text-white text-2xl">Yükleniyor...</div>;
            }

            return user ? <PerformancePanel user={user} /> : <AuthScreen />;
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
