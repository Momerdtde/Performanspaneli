        const getDefaultCriteriaForClassName = (className) => {

        // 1. Performans Notu Hesaplama (%50 Ders İçi Durum, %50 Yazma Görevleri Ortalaması)
        const calculateWeightedPerf1 = (assessment) => {
            if (!assessment) return null;
            const d = assessment.dersIciDurum;
            const y1 = assessment.yazma1;
            const y2 = assessment.yazma2;

            const hasD = d !== null && d !== undefined && d !== '' && !isNaN(d);
            const hasY1 = y1 !== null && y1 !== undefined && y1 !== '' && !isNaN(y1);
            const hasY2 = y2 !== null && y2 !== undefined && y2 !== '' && !isNaN(y2);

            if (!hasD && !hasY1 && !hasY2) return null;

            let score = 0;
            let weightSum = 0;

            if (hasD) {
                score += Number(d) * 0.5;
                weightSum += 0.5;
            }

            if (hasY1 || hasY2) {
                const ySum = (hasY1 ? Number(y1) : 0) + (hasY2 ? Number(y2) : 0);
                const yCount = (hasY1 ? 1 : 0) + (hasY2 ? 1 : 0);
                const yAvg = ySum / yCount;
                score += yAvg * 0.5;
                weightSum += 0.5;
            }

            return weightSum > 0 ? Math.round(score / weightSum) : null;
        };

        // Öğrenci Sıralama Fonksiyonu (Okul Numarasına Göre)
        const sortStudentsList = (students) => {
            return [...students].sort((a, b) => {
                const numA = parseInt(a.schoolNumber, 10);
                const numB = parseInt(b.schoolNumber, 10);
                if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
                if (!isNaN(numA)) return -1;
                if (!isNaN(numB)) return 1;
                return (a.name || '').localeCompare(b.name || '', 'tr');
            });
        };

        // e-Okul PDF Ayrıştırıcı (9f.pdf, 10d.PDF ve tüm e-Okul Puan Çizelgesi formatlarını otomatik çözer)
        const parseEOkulPdfFile = async (file) => {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let detectedClassName = '';
            let detectedMeta = {};
            let allNumericTokens = [];
            let allNameTokens = [];

            const blacklist = [
                'OKUL', 'KURUM', 'DÖNEM', 'PUAN', 'ÇİZELGESİ', 'ÖĞRENCİ', 'SINAVLAR', 
                'YAZILI', 'PERFORMANS', 'UYGULAMA', 'PROJE', 'MUAF', 'NUMARASI', 'SIRA', 
                'ADI SOYADI', 'DERS', 'ÖĞRETMENİ', 'MÜDÜR', 'YARDIMCISI', 'DEVAMSIZLIKTAN', 
                'BAŞARISIZ', 'SAYILAN', 'ALANI', 'DALI', 'ŞUBESİ', 'SAATİ', 'HAFTALIK', 
                'TÜRK DİLİ', 'EDEBİYATI', 'İSTANBUL', 'ANADOLU', 'LİSESİ', 'CE-OKUL', 'NO'
            ];

            for (let pageNum = 1; pdf.numPages >= pageNum; pageNum++) {
                const page = await pdf.getPage(pageNum);
                const textContent = await page.getTextContent();
                const fullPageText = textContent.items.map(i => i.str).join(' ');

                // Sınıf / Şube tespiti (örn: "AL 9. Sınıf / F Şubesi" veya "AL-10. Sınıf / D Şubesi" -> "9-F", "10-D")
                const classMatch = fullPageText.match(/(\d+)\s*\.\s*Sınıf\s*\/\s*([A-ZÇĞİÖŞÜ])\s*Şubesi/i);
                if (classMatch && !detectedClassName) {
                    detectedClassName = `${classMatch[1]}-${classMatch[2].toUpperCase()}`;
                }

                // Okul Adı tespiti
                const schoolMatch = fullPageText.match(/:\s*([^:]+LİSESİ|[^:]+OKULU)/i);
                if (schoolMatch && !detectedMeta.schoolName) {
                    detectedMeta.schoolName = schoolMatch[1].replace(/PUANLARI.*/i, '').trim();
                }

                let pageNumTokens = [];
                let pageNameTokens = [];

                textContent.items.forEach(item => {
                    const str = item.str.replace(/\|/g, '').trim();
                    if (!str) return;
                    const x = item.transform[4];
                    const y = item.transform[5];

                    // Sol sütundaki Sıra No ve Okul Numaraları (X koordinatı < 145)
                    if (145 > x && /^\d+$/.test(str)) {
                        const val = parseInt(str, 10);
                        if (val > 0 && 99999 > val) {
                            pageNumTokens.push({ val, x, y });
                        }
                    } else if (x >= 75 && 320 > x && str.length >= 4) {
                        // İsim Sütunu
                        const isCleanLetters = /^[A-ZÇĞİÖŞÜa-zçğıöşü\s]+$/.test(str);
                        const upper = str.toLocaleUpperCase('tr-TR');
                        const isBlacklisted = blacklist.some(w => upper.includes(w));
                        if (isCleanLetters && !isBlacklisted && str.trim().includes(' ')) {
                            pageNameTokens.push({ name: str.replace(/\s+/g, ' ').trim(), x, y });
                        }
                    }
                });

                // Aynı satırdaki (Y koordinatı çok yakın) isim parçalarını birleştir ve yukarıdan aşağıya sırala
                pageNameTokens.sort((a, b) => b.y - a.y || a.x - b.x);
                const mergedNames = [];
                pageNameTokens.forEach(t => {
                    const existing = mergedNames.find(m => 4 > Math.abs(m.y - t.y));
                    if (existing) {
                        existing.name = (existing.name + ' ' + t.name).replace(/\s+/g, ' ').trim();
                    } else {
                        mergedNames.push({ ...t });
                    }
                });

                // İmza sirkülerindeki (Öğretmen, Müdür Yardımcısı, Müdür) isimleri ayıkla
                const teacherIndex = mergedNames.findIndex(m => {
                    // Genelde en altta aynı Y hizasında veya sonrasında "DERS ÖĞRETMENİ" yer alır
                    return false;
                });

                allNameTokens.push(...mergedNames);
                allNumericTokens.push(...pageNumTokens);
            }

            // Numaraları Y koordinatına göre yukarıdan aşağıya grupla
            allNumericTokens.sort((a, b) => b.y - a.y || a.x - b.x);
            const numRows = [];
            allNumericTokens.forEach(t => {
                const row = numRows.find(r => 4.5 > Math.abs(r.y - t.y));
                if (row) {
                    row.vals.push(t.val);
                } else {
                    numRows.push({ y: t.y, vals: [t.val] });
                }
            });

            // Her satırdaki [Sıra No, Okul No] çiftlerinden gerçek Okul Numarasını ayıkla
            const schoolNumbers = [];
            let expectedSeq = 1;
            numRows.forEach(r => {
                const vals = r.vals;
                if (vals.length >= 2) {
                    const idx = vals.indexOf(expectedSeq);
                    if (idx !== -1) {
                        const other = vals.find((_, i) => i !== idx);
                        schoolNumbers.push({ schoolNo: other, y: r.y });
                        expectedSeq++;
                    } else {
                        schoolNumbers.push({ schoolNo: Math.max(...vals), y: r.y });
                        expectedSeq++;
                    }
                } else if (vals.length === 1) {
                    if (vals[0] !== expectedSeq) {
                        schoolNumbers.push({ schoolNo: vals[0], y: r.y });
                        expectedSeq++;
                    }
                }
            });

            // Öğrenci sayısı kadar ismi al (En alttaki öğretmen/idareci isimlerini dışarıda bırakır)
            const validStudentCount = schoolNumbers.length;
            const studentNames = allNameTokens.slice(0, validStudentCount);

            const students = [];
            for (let i = 0; studentNames.length > i; i++) {
                students.push({
                    schoolNumber: schoolNumbers[i] ? String(schoolNumbers[i].schoolNo) : String(i + 1),
                    name: studentNames[i].name
                });
            }

            if (!detectedClassName) {
                detectedClassName = file.name.replace(/\.pdf$/i, '').toUpperCase();
            }

            return { className: detectedClassName, students, meta: detectedMeta };
        };
