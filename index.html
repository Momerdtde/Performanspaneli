        // 1. Performans Notu Hesaplama (%50 Ders İçi Durum, %50 Yazma Görevleri)
        const calculateWeightedPerf1 = (assessment) => {
            if (!assessment) return null;
            const d = assessment.dersIciDurum;
            const y1 = assessment.yazma1;
            const y2 = assessment.yazma2;

            const hasD = d !== null && d !== undefined && d !== '' && !isNaN(d);
            const hasY1 = y1 !== null && y1 !== undefined && y1 !== '' && !isNaN(y1);
            const hasY2 = y2 !== null && y2 !== undefined && y2 !== '' && !isNaN(y2);

            if (!hasD && !hasY1 && !hasY2) return null;

            let score = 0;
            let weightSum = 0;

            if (hasD) {
                score += Number(d) * 0.5;
                weightSum += 0.5;
            }

            if (hasY1 || hasY2) {
                const ySum = (hasY1 ? Number(y1) : 0) + (hasY2 ? Number(y2) : 0);
                const yCount = (hasY1 ? 1 : 0) + (hasY2 ? 1 : 0);
                const yAvg = ySum / yCount;
                score += yAvg * 0.5;
                weightSum += 0.5;
            }

            return weightSum !== 0 ? Math.round(score / weightSum) : null;
        };

        const focusClasses = "focus:outline-none focus:ring-2 focus:ring-blue-500";

        function AuthScreen() {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isLogin, setIsLogin] = useState(true);
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);
            const handleSubmit = (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                if (isLogin) {
                    auth.signInWithEmailAndPassword(email, password).catch(err => setError(err.message)).finally(() => setLoading(false));
                } else {
                    auth.createUserWithEmailAndPassword(email, password).catch(err => setError(err.message)).finally(() => setLoading(false));
                }
            };
            return (
                <div className="bg-slate-800/50 backdrop-blur-sm border border-slate-700 rounded-2xl shadow-2xl shadow-blue-500/10 p-8 text-white w-full max-w-md mx-auto auth-form">

        const StudentAssessmentCard = memo(({ student, index, semester, onScoreChange }) => {
            const donemKey = semester === 1 ? 'donem1' : 'donem2';
            const assessment = (student.assessments && student.assessments[donemKey]) || {};
            
            const calculatePerf1 = () => {
                const val = calculateWeightedPerf1(assessment);
                return val === null ? '-' : val;
            };

            const calculatePerf2 = () => {
                const notes = [assessment.kitap1, assessment.kitap2];
                const validNotes = notes.filter(n => n !== null && n !== undefined && n !== '' && !isNaN(n));
                if (validNotes.length === 0) return '-';
                const sum = validNotes.reduce((acc, n) => acc + Number(n), 0);
                return Math.round(sum / validNotes.length);
            };

                const { jsPDF } = window.jspdf;

            const parseStudentLine = (line) => {
                const trimmed = line.trim();
                if (!trimmed) return null;
                const matchTwoNums = trimmed.match(/^(\d+)\s*[.\-]?\s+(\d+)\s*[-–.]?\s+(.+)$/);
                if (matchTwoNums) {
                    const n1 = parseInt(matchTwoNums[1], 10);
                    const n2 = parseInt(matchTwoNums[2], 10);
                    const schoolNo = (60 >= n1 && n2 > n1) ? String(n2) : String(n1);
                    return { studentNumber: schoolNo, name: matchTwoNums[3].trim() };
                }
                const matchSingleNum = trimmed.match(/^(\d+)\s*[.\-–]?\s*(.+)$/);
                if (matchSingleNum) {
                    return { studentNumber: matchSingleNum[1], name: matchSingleNum[2].trim() };
                }
                return { studentNumber: '', name: trimmed };
            };

            const extractStudentsFromPdfFile = async (file) => {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const extractedStudents = [];

                const ignoreWords = [
                    'OKUL', 'KURUM', 'DÖNEM', 'PUAN', 'ÇİZELGESİ', 'DERS', 'ALANI', 'SINIFI',
                    'HAFTALIK', 'ÖĞRENCİNİN', 'SINAVLAR', 'YAZILI', 'PERFORMANS', 'UYGULAMA',
                    'NUMARASI', 'ADI SOYADI', 'PROJE', 'MUAF', 'ÖĞRETMENİ', 'MÜDÜR', 'DEVAMSIZLIK',
                    'CE-OKUL', 'E-OKUL', 'BAŞARISIZ', 'GİRİLMEMİŞ', 'SAAT', 'ŞUBESİ', 'SIRA', 'Y1', 'Y2'
                ];

                for (let pageNum = 1; pdf.numPages >= pageNum; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const textContent = await page.getTextContent();
                    
                    const rows = [];
                    textContent.items.forEach(item => {
                        const str = item.str.trim();
                        if (!str) return;
                        const x = item.transform[4];
                        const y = item.transform[5];
                        let row = rows.find(r => 4 >= Math.abs(r.y - y));
                        if (!row) {
                            row = { y, items: [] };
                            rows.push(row);
                        }
                        row.items.push({ str, x });
                    });

                    rows.sort((a, b) => b.y - a.y);

                    rows.forEach(row => {
                        row.items.sort((a, b) => a.x - b.x);
                        const lineText = row.items.map(i => i.str).join(' ').trim();
                        const upperLine = lineText.toLocaleUpperCase('tr-TR');

                        if (ignoreWords.some(w => upperLine.includes(w))) return;
                        if (lineText.includes(':') || lineText.includes('/')) return;

                        const match = lineText.match(/^(\d+)\s+(\d+)\s+([A-ZÇĞİÖŞÜa-zçğıöşü\s]+)$/);
                        if (match) {
                            const num1 = parseInt(match[1], 10);
                            const num2 = parseInt(match[2], 10);
                            const name = match[3].trim();

                            if (name.split(/\s+/).length >= 2) {
                                let schoolNumber = num1;
                                if (60 >= num1 && num2 > num1) {
                                    schoolNumber = num2;
                                } else if (60 >= num2 && num1 > num2) {
                                    schoolNumber = num1;
                                } else {
                                    schoolNumber = Math.max(num1, num2);
                                }
                                extractedStudents.push({
                                    studentNumber: String(schoolNumber),
                                    name: name
                                });
                            }
                        }
                    });
                }
                return extractedStudents;
            };

            const handlePdfUpload = async (e) => {

                try {

                        setImportText(prev => prev ? prev + '\n' + formattedLines : formattedLines);

                }
            };

            const handleAddClass = () => {
                if (newClassName.trim() === '') return;
                const newClass = { id: Date.now(), name: newClassName.trim(), students: [], bookTitles: JSON.parse(JSON.stringify(newBookTitleStructure)) };

            const handleTempSettingsChange = (e) => {

            const handleSaveSettings = () => { setSettings(tempSettings); setShowSaveConfirmation(true); setTimeout(() => setShowSaveConfirmation(false), 2000); };
            const confirmDeleteClass = (classId) => { const updatedClasses = classes.filter(c => c.id !== classId); setClasses(updatedClasses); if (activeClassId === classId) { setActiveClassId(updatedClasses.length > 0 ? updatedClasses[0].id : null); } setClassToDelete(null); };
            const handleDeleteStudent = (studentId) => { if (!activeClassId) return; setClasses(prev => prev.map(c => c.id === activeClassId ? { ...c, students: c.students.filter(s => s.id !== studentId) } : c )); setStudentToDelete(null); };
            
            const calculateGrade = useCallback((student) => {

            }, [settings]);
            
            const handleManualScoreChange = useCallback((studentId, scoreType, value) => {
                const scoreToSet = value === '' ? 0 : Math.max(0, Number(value));
                setClasses(prevClasses => prevClasses.map(c => {

            const handleSaveNote = (studentId, newNote) => { setClasses(prev => prev.map(c => { if (c.id !== activeClassId) return c; return { ...c, students: c.students.map(s => s.id === studentId ? { ...s, notes: newNote } : s )}; })); setEditingNoteStudent(null); };
            const handleUndoLastAction = () => { if (!lastAction) return; const { studentId, scoreType, classId } = lastAction; let studentName = ''; setClasses(prev => prev.map(c => { if (c.id !== classId) return c; return { ...c, students: c.students.map(s => { if (s.id === studentId && s.scores[scoreType] > 0) { studentName = s.name; return { ...s, scores: { ...s.scores, [scoreType]: s.scores[scoreType] - 1 } }; } return s; })}; })); setUndoMessage(`${studentName} isimli öğrencinin son puanı geri alındı.`); setLastAction(null); setTimeout(() => setUndoMessage(''), 3000); };
            const distributeScores = (totalScore, criteria) => { let distributed = {}; let currentTotal = 0; const scoresWithDiff = Object.entries(criteria).map(([key, { max }]) => { const rawScore = (totalScore / 100) * max; const roundedScore = Math.round(rawScore); currentTotal += roundedScore; return { key, max, rounded: roundedScore, diff: roundedScore - rawScore }; }); let difference = totalScore - currentTotal; scoresWithDiff.sort((a, b) => a.diff - b.diff); while (difference !== 0) { for (const item of scoresWithDiff) { if (difference === 0) break; if (difference > 0 && item.max > item.rounded) { item.rounded++; difference--; } else if (0 > difference && item.rounded > 0) { item.rounded--; difference++; } } } scoresWithDiff.forEach(item => { distributed[item.key] = item.rounded; }); return distributed; };

            };

            const filteredStudents = (list) => {
                if (!list) return [];
                const normalizedSearchTerm = searchTerm.toLocaleLowerCase('tr-TR');

                    (student.name || '').toLocaleLowerCase('tr-TR').includes(normalizedSearchTerm) ||

            return (
                <Fragment>

                             </div>

                                 <button onClick={() => setActiveView('assessments')} className={`flex items-center gap-2 py-2 px-4 rounded-lg transition-colors ${activeView === 'assessments' ? 'bg-blue-600 text-white' : 'bg-slate-700 hover:bg-slate-600 text-white'}`}> <BookIcon /> Performans Notları </button>
                                 <button onClick={() => setActiveView('speaking-exam')} className={`flex items-center gap-2 py-2 px-4 rounded-lg transition-colors ${activeView === 'speaking-exam' ? 'bg-blue-600 text-white' : 'bg-slate-700 hover:bg-slate-600 text-white'}`}> <MicIcon /> Konuşma Sınavı </button>
                                 <button onClick={() => setActiveView('speaking-exam-9th')} className={`flex items-center gap-2 py-2 px-4 rounded-lg transition-colors ${activeView === 'speaking-exam-9th' ? 'bg-blue-600 text-white' : 'bg-slate-700 hover:bg-slate-600 text-white'}`}> <EditIcon /> 9. Sınıf Konuşma </button>
                                 <button onClick={() => setActiveView('settings')} className={`flex items-center gap-2 py-2 px-4 rounded-lg transition-colors ${activeView === 'settings' ? 'bg-blue-600 text-white' : 'bg-slate-700 hover:bg-slate-600 text-white'}`}> <SettingsIcon /> Ayarlar </button>
                                 <button onClick={() => auth.signOut()} className={`flex items-center gap-2 py-2 px-4 rounded-lg bg-red-600/80 hover:bg-red-600 text-white`}> <LogOutIcon /> Çıkış Yap </button>

                        )}
                    </div>
                    {classToDelete && (<div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 confirm-modal"><div className="bg-slate-800 rounded-lg p-8 shadow-xl border border-slate-700 mx-4"><h3 className="text-xl font-bold text-white mb-4">Sınıfı Silme Onayı</h3><p className="text-slate-300 mb-6">"<span className="font-bold">{classToDelete.name}</span>" sınıfını ve tüm verileri <br/> kalıcı olarak silmek istediğinizden emin misiniz?</p><div className="flex justify-end gap-4"><button onClick={() => setClassToDelete(null)} className="py-2 px-5 bg-slate-600 text-white rounded-lg hover:bg-slate-500 font-semibold">Hayır, Vazgeç</button><button onClick={() => confirmDeleteClass(classToDelete.id)} className="py-2 px-5 bg-red-600 text-white rounded-lg hover:bg-red-700 font-bold">Evet, Sil</button></div></div></div>)}
                    {studentToDelete && (<div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 confirm-modal"><div className="bg-slate-800 rounded-lg p-8 shadow-xl border border-slate-700 mx-4"><h3 className="text-xl font-bold text-white mb-4">Öğrenci Silme Onayı</h3><p className="text-slate-300 mb-6">"<span className="font-bold">{studentToDelete.name}</span>" isimli öğrenciyi <br/> kalıcı olarak silmek istediğinizden emin misiniz?</p><div className="flex justify-end gap-4"><button onClick={() => setStudentToDelete(null)} className="py-2 px-5 bg-slate-600 text-white rounded-lg hover:bg-slate-500 font-semibold">Hayır, Vazgeç</button><button onClick={() => handleDeleteStudent(studentToDelete.id)} className="py-2 px-5 bg-red-600 text-white rounded-lg hover:bg-red-700 font-bold">Evet, Sil</button></div></div></div>)}
                    {editingNoteStudent && <NoteModal student={editingNoteStudent} onSave={handleSaveNote} onClose={() => setEditingNoteStudent(null)} />}
                    {evaluatingSpeaking && <SpeakingExamModal student={evaluatingSpeaking.student} semester={evaluatingSpeaking.semester} scores={evaluatingSpeaking.scores} onSave={handleSaveSpeakingExam} onClose={() => setEvaluatingSpeaking(null)} onScoreChange={handleSpeakingScoreChange} examNumber={evaluatingSpeaking.examNumber} />}
                    {evaluatingSpeaking9th && <SpeakingExam9thModal student={evaluatingSpeaking9th.student} scores={evaluatingSpeaking9th.scores} onSave={handleSaveSpeakingExam9th} onClose={() => setEvaluatingSpeaking9th(null)} onScoreChange={handleSpeaking9thScoreChange} examNumber={evaluatingSpeaking9th.examNumber} />}
                    {showScrollTop && (<button onClick={() => window.scrollTo({top: 0, behavior: 'smooth'})} className="fixed bottom-6 right-6 bg-blue-600 text-white p-3 rounded-full shadow-lg hover:bg-blue-700 transition-opacity z-50"><ArrowUpIcon /></button>)}
                </Fragment>
            );
        }

        // Ana Uygulama Yöneticisi
        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(user => {
                    setUser(user);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (loading) {
                return <div className="text-center text-white text-2xl">Yükleniyor...</div>;
            }

            return user ? <PerformancePanel user={user} /> : <AuthScreen />;
        }

        ReactDOM.render(<ErrorBoundary><App /></ErrorBoundary>, document.getElementById('root'));
    </script>
</body>
</html>
