    <script type="text/babel">
        const { useState, useEffect, Fragment, useCallback, memo } = React;

        const firebaseConfig = {

        // Varsayılan Şablon Kriterler
        const DEFAULT_SPEAKING_PRESET = [

        ];

        const NINTH_GRADE_SPEAKING_PRESET = [
            { id: 'planlama', label: 'Planlama: Etkili bir giriş yapmış, konuşmayı sürdürmüş, uygun örnekler sunmuş ve etkili tamamlamıştır.', max: 15 },
            { id: 'dusunselSurec', label: 'Düşünsel Süreçleri Kontrol Etme: Düşünceleri ana fikir etrafında tekrara düşmeden sunmuştur.', max: 15 },
            { id: 'sozVarligi', label: 'Söz Varlığı: Bağlama uygun zengin kelime hazinesi ve Türkçe kelimeler kullanmıştır.', max: 15 },
            { id: 'organizasyon', label: 'Organizasyon: Duygu ve düşüncelerini tutarlı bir biçimde organize etmiştir.', max: 10 },
            { id: 'akicilik', label: 'Akıcılık: İşitilebilir ses tonuyla, gereksiz ses tekrarına düşmeden, vurgu ve tonlamaya dikkat ederek konuşmuştur.', max: 20 },
            { id: 'bedenDili', label: 'Beden Dili: Jest ve mimiklerini etkili kullanmış, dinleyicilerle yeterli göz teması kurmuştur.', max: 15 },
            { id: 'isBirligi', label: 'İş Birliği: Grup çalışmalarında üzerine düşen sorumlulukları yerine getirmiştir.', max: 10 }
        ];

        const IN_CLASS_CRITERIA = {
            derse_zamaninda_gelme: { label: 'Derse zamanında gelme', max: 5 },
            derse_devam_ilgi_saygi: { label: 'Derse devam, ilgi ve saygı', max: 10 },
            arac_gerec: { label: 'Ders araç ve gereçlerini getirme', max: 10 },
            ilgi_not_tutma: { label: 'Derse ilgi ve not tutma', max: 10 },
            soru_cevap: { label: 'Soru ve önerilere cevap verme', max: 10 },
            elestirel_dusunme: { label: 'Eleştirel düşünerek soru sorma', max: 10 },
            uygulama_istekli: { label: 'Uygulamalara katılmaya istekli olma', max: 10 },
            turkce_kullanimi: { label: 'Türkçeyi doğru kullanma ve olumlu davranış', max: 10 },
            on_hazirlik: { label: 'Konuya ön hazırlık yaparak gelme', max: 15 },
            odev_zamaninda: { label: 'Ödevlerini zamanında yapma', max: 10 }
        };

        const PERFORMANCE_TASK_CRITERIA = {
            ogretmenle_gorusme: { label: 'Öğretmenle düzenli görüşme ve önerileri dikkate alma', max: 5 },
            plan_yapma: { label: 'Ödeve uygun plan yapma ve bu plana göre ödevini hazırlama', max: 5 },
            bilgi_dogruluk: { label: 'Bilgilerin doğruluğu ve özgünlüğü', max: 10 },
            kavram_anlatma: { label: 'Temel kavramları anlatma, konunun özünü ifade etme', max: 15 },
            sunum_hakimiyet: { label: 'Ödevi sunma ve konuya hakimiyet', max: 25 },
            materyal_destek: { label: 'Yeterli materyalle (poster, grafik vb.) destekleme', max: 10 },
            anlasilir_yazma: { label: 'Anlaşılır yazma ve dilbilgisi kurallarına uyma', max: 10 },
            kaynak_kullanma: { label: 'Farklı kaynaklardan yararlanma ve belirtme', max: 10 },
            zamaninda_teslim: { label: 'Ödevi zamanında teslim etme', max: 10 }
        };

        const defaultScores = { inClassPlus: 0, inClassMinus: 0, homeworkPlus: 0, homeworkMinus: 0 };
        const newAssessmentStructure = {
            donem1: { dersIciDurum: null, yazma1: null, yazma2: null, kitap1: null, kitap2: null },
            donem2: { dersIciDurum: null, yazma1: null, yazma2: null, kitap1: null, kitap2: null }
        };
        const newBookTitleStructure = { donem1: { kitap1: '', kitap2: '' }, donem2: { kitap1: '', kitap2: '' } };
        const newSpeakingExamStructure = { donem1: { sinav1: null, sinav2: null }, donem2: { sinav1: null, sinav2: null } };

        // %50 Ders İçi Durum + %50 Yazma Görevleri Ortalaması
        const calculateWeightedPerf1 = (assessment) => {
            if (!assessment) return null;
            const d = assessment.dersIciDurum;
            const y1 = assessment.yazma1;
            const y2 = assessment.yazma2;
            const hasD = d !== null && d !== undefined && d !== '' && !isNaN(d);
            const hasY1 = y1 !== null && y1 !== undefined && y1 !== '' && !isNaN(y1);
            const hasY2 = y2 !== null && y2 !== undefined && y2 !== '' && !isNaN(y2);
            if (!hasD && !hasY1 && !hasY2) return null;

            let score = 0;
            let weightSum = 0;
            if (hasD) { score += Number(d) * 0.5; weightSum += 0.5; }
            if (hasY1 || hasY2) {
                const ySum = (hasY1 ? Number(y1) : 0) + (hasY2 ? Number(y2) : 0);
                const yCount = (hasY1 ? 1 : 0) + (hasY2 ? 1 : 0);
                score += (ySum / yCount) * 0.5;
                weightSum += 0.5;
            }
            return weightSum > 0 ? Math.round(score / weightSum) : null;
        };

        const sortStudentsList = (students) => {
            return [...students].sort((a, b) => {
                const numA = parseInt(a.schoolNumber, 10);
                const numB = parseInt(b.schoolNumber, 10);
                if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
                if (!isNaN(numA)) return -1;
                if (!isNaN(numB)) return 1;
                return (a.name || '').localeCompare(b.name || '', 'tr');
            });
        };

        // İkonlar
        const Icon = ({ d, size = 18 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                {Array.isArray(d) ? d.map((p, i) => <path key={i} d={p} />) : <path d={d} />}
            </svg>
        );

        const focusClasses = "focus:outline-none focus:ring-2 focus:ring-blue-500";

        function AuthScreen() {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isLogin, setIsLogin] = useState(true);
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                const action = isLogin ? auth.signInWithEmailAndPassword(email, password) : auth.createUserWithEmailAndPassword(email, password);
                action.catch(err => setError(err.message)).finally(() => setLoading(false));
            };

            return (
                <div className="bg-slate-800/60 backdrop-blur-sm border border-slate-700 rounded-2xl shadow-2xl p-8 text-white w-full max-w-md mx-auto mt-12 fade-in">
                    <h1 className="cool-title text-4xl font-bold text-center mb-6">Performans Paneli</h1>
                    <h2 className="text-xl font-bold text-center mb-6 text-slate-200">{isLogin ? 'Öğretmen Girişi' : 'Yeni Hesap Oluştur'}</h2>
                    <form onSubmit={handleSubmit} className="space-y-4">
                        <div>
                            <label className="block text-sm text-slate-400">E-posta Adresi</label>
                            <input type="email" value={email} onChange={e => setEmail(e.target.value)} required className={`w-full mt-1 p-2.5 bg-slate-700 border border-slate-600 rounded-lg text-white ${focusClasses}`} />
                        </div>
                        <div>
                            <label className="block text-sm text-slate-400">Şifre</label>
                            <input type="password" value={password} onChange={e => setPassword(e.target.value)} required className={`w-full mt-1 p-2.5 bg-slate-700 border border-slate-600 rounded-lg text-white ${focusClasses}`} />
                        </div>
                        {error && <p className="text-red-400 text-sm text-center">{error}</p>}
                        <button type="submit" disabled={loading} className="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 disabled:bg-slate-600">
                            {loading ? 'İşleniyor...' : (isLogin ? 'Giriş Yap' : 'Kayıt Ol')}
                        </button>
                    </form>
                    <p className="text-center text-slate-400 mt-5 text-sm">
                        {isLogin ? "Hesabınız yok mu? " : "Zaten hesabınız var mı? "}
                        <button onClick={() => setIsLogin(!isLogin)} className="font-semibold text-blue-400 hover:underline">
                            {isLogin ? 'Kayıt Olun' : 'Giriş Yapın'}
                        </button>
                    </p>
                </div>
            );
        }

        // Dinamik Kriter Düzenleme Modalı
        const CriteriaManagerModal = ({ activeClass, classes, onSaveCriteria, onCopyCriteriaToAll, onClose }) => {
            const initialCriteria = (activeClass.speakingCriteria && activeClass.speakingCriteria.length > 0)
                ? activeClass.speakingCriteria
                : DEFAULT_SPEAKING_PRESET;

            const [items, setItems] = useState(JSON.parse(JSON.stringify(initialCriteria)));
            const totalMax = items.reduce((sum, item) => sum + (Number(item.max) || 0), 0);

            const handleLabelChange = (index, val) => {
                setItems(prev => prev.map((it, idx) => idx === index ? { ...it, label: val } : it));
            };

            const handleMaxChange = (index, val) => {
                setItems(prev => prev.map((it, idx) => idx === index ? { ...it, max: Number(val) || 0 } : it));
            };

            const handleAddCriterion = () => {
                setItems(prev => [...prev, { id: 'krit_' + Date.now(), label: 'Yeni değerlendirme ölçütü...', max: 10 }]);
            };

            const handleRemoveCriterion = (index) => {
                setItems(prev => prev.filter((_, idx) => idx !== index));
            };

            const applyPreset = (preset) => {
                setItems(JSON.parse(JSON.stringify(preset)));
            };

            return (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 fade-in">
                    <div className="bg-slate-800 rounded-xl shadow-2xl border border-slate-700 w-full max-w-3xl flex flex-col max-h-[90vh]">
                        <div className="p-5 border-b border-slate-700 flex justify-between items-center">
                            <div>
                                <h3 className="text-xl font-bold text-white">Konuşma Sınavı Kriterlerini Özelleştir</h3>
                                <p className="text-xs text-slate-400 mt-1">Seçili Sınıf: <span className="text-amber-400 font-semibold">{activeClass.name}</span> — Her sınıf düzeyi için farklı kriterler belirleyebilirsiniz.</p>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-white p-1">✕</button>
                        </div>

                        <div className="px-5 py-3 bg-slate-900/60 border-b border-slate-700 flex flex-wrap gap-2 items-center justify-between">
                            <div className="flex flex-wrap gap-2 items-center">
                                <span className="text-xs text-slate-400">Hazır Şablon Yükle:</span>
                                <button onClick={() => applyPreset(DEFAULT_SPEAKING_PRESET)} className="text-xs bg-slate-700 hover:bg-slate-600 text-sky-300 py-1.5 px-3 rounded-md font-medium">
                                    Standart (5 Kriter - 20'şer Puan)
                                </button>
                                <button onClick={() => applyPreset(NINTH_GRADE_SPEAKING_PRESET)} className="text-xs bg-slate-700 hover:bg-slate-600 text-purple-300 py-1.5 px-3 rounded-md font-medium">
                                    9. Sınıf Maarif Modeli (7 Kriter)
                                </button>
                            </div>
                            <div className={`text-sm font-bold px-3 py-1 rounded-md ${totalMax === 100 ? 'bg-green-500/20 text-green-400' : 'bg-amber-500/20 text-amber-400'}`}>
                                Toplam Puan: {totalMax} / 100
                            </div>
                        </div>

                        <div className="p-5 overflow-y-auto space-y-3 flex-1">
                            {items.map((item, idx) => (
                                <div key={item.id || idx} className="flex items-start gap-2 bg-slate-900/50 p-3 rounded-lg border border-slate-700/70">
                                    <span className="bg-slate-700 text-slate-300 text-xs font-bold px-2 py-1.5 rounded mt-1">K.{idx + 1}</span>
                                    <textarea
                                        rows="2"
                                        value={item.label}
                                        onChange={e => handleLabelChange(idx, e.target.value)}
                                        className={`flex-grow p-2 bg-slate-700 border border-slate-600 rounded-md text-sm text-white ${focusClasses}`}

                                        />
                                    </div>
                                    <button onClick={() => handleRemoveCriterion(idx)} className="mt-4 p-2 text-red-400 hover:bg-red-500/20 rounded-md" title="Kriteri Sil">
                                        Sil
                                    </button>
                                </div>
                            ))}
                            <button onClick={handleAddCriterion} className="w-full py-2.5 border-2 border-dashed border-slate-600 hover:border-blue-500 text-blue-400 rounded-lg font-semibold text-sm transition-colors">
                                + Yeni Kriter Ekle
                            </button>
                        </div>

                        <div className="p-5 border-t border-slate-700 bg-slate-800/90 flex flex-wrap justify-between items-center gap-3">
                            <button
                                onClick={() => onCopyCriteriaToAll(items)}
                                className="py-2 px-4 bg-indigo-600/80 hover:bg-indigo-600 text-white rounded-lg text-sm font-semibold"

                                Bu Kriterleri Tüm Sınıflara Uygula
                            </button>
                            <div className="flex gap-3">
                                <button onClick={onClose} className="py-2 px-5 bg-slate-600 text-white rounded-lg hover:bg-slate-500 font-semibold">Vazgeç</button>
                                <button onClick={() => onSaveCriteria(items)} className="py-2 px-5 bg-green-600 text-white rounded-lg hover:bg-green-700 font-bold">Sınıf İçin Kaydet</button>

                        </div>
                    </div>
                </div>
            );
        };

        // Dinamik Konuşma Sınavı Değerlendirme Modalı
        const DynamicSpeakingExamModal = memo(({ student, criteria, scores, onSave, onClose, onScoreChange, examNumber, className }) => {
            const totalScore = criteria.reduce((sum, c) => sum + (Number(scores[c.id]) || 0), 0);
            const maxPossible = criteria.reduce((sum, c) => sum + (Number(c.max) || 0), 0);

            const handleQuickFillAllFull = () => {
                criteria.forEach(c => onScoreChange(c.id, Number(c.max) || 0));
            };

            return (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 fade-in">
                    <div className="bg-slate-800 rounded-xl shadow-2xl border border-slate-700 w-full max-w-3xl flex flex-col max-h-[90vh]">
                        <div className="p-5 border-b border-slate-700 flex justify-between items-center">
                            <div>
                                <h3 className="text-xl font-bold text-white">
                                    {examNumber}. Konuşma Sınavı ({className}): <span className="text-blue-400">{student.schoolNumber ? `[${student.schoolNumber}] ` : ''}{student.name}</span>
                                </h3>
                            </div>
                            <button onClick={handleQuickFillAllFull} className="text-xs bg-emerald-600/30 border border-emerald-500 text-emerald-300 px-3 py-1.5 rounded-md hover:bg-emerald-600/50 font-semibold">
                                Tümüne Tam Puan Ver
                            </button>
                        </div>
                        <div className="p-5 overflow-y-auto space-y-3 flex-1">
                            {criteria.map((c, idx) => {
                                const maxVal = Number(c.max) || 0;
                                const halfVal = Math.round(maxVal / 2);
                                const currentVal = scores[c.id] !== undefined && scores[c.id] !== null ? Number(scores[c.id]) : '';
                                return (
                                    <div key={c.id} className="p-3.5 bg-slate-900/50 rounded-lg border border-slate-700/60 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                        <div className="flex-1">
                                            <span className="text-xs font-bold text-sky-400 mr-2">Kriter {idx + 1} ({maxVal} Puan):</span>
                                            <span className="text-slate-200 text-sm">{c.label}</span>
                                        </div>
                                        <div className="flex items-center gap-2 self-end sm:self-center shrink-0">
                                            <button
                                                type="button"
                                                onClick={() => onScoreChange(c.id, maxVal)}
                                                className={`px-2.5 py-1 rounded text-xs font-bold border ${currentVal === maxVal ? 'bg-green-600 border-green-400 text-white' : 'bg-slate-700 border-slate-600 text-slate-300 hover:bg-slate-600'}`}
                                            >
                                                Tam ({maxVal})
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => onScoreChange(c.id, halfVal)}
                                                className={`px-2.5 py-1 rounded text-xs font-bold border ${currentVal === halfVal ? 'bg-amber-600 border-amber-400 text-white' : 'bg-slate-700 border-slate-600 text-slate-300 hover:bg-slate-600'}`}
                                            >
                                                Orta ({halfVal})
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => onScoreChange(c.id, 0)}
                                                className={`px-2.5 py-1 rounded text-xs font-bold border ${currentVal === 0 ? 'bg-red-600 border-red-400 text-white' : 'bg-slate-700 border-slate-600 text-slate-300 hover:bg-slate-600'}`}
                                            >
                                                Zayıf (0)
                                            </button>
                                            <input
                                                type="number"
                                                placeholder="Puan"
                                                value={currentVal}
                                                onChange={e => {
                                                    const val = e.target.value === '' ? null : Math.max(0, Math.min(maxVal, Number(e.target.value)));
                                                    onScoreChange(c.id, val);
                                                }}
                                                className={`w-14 p-1 text-center bg-slate-700 border border-slate-500 rounded text-sm font-bold text-white ${focusClasses}`}
                                            />
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                        <div className="p-5 border-t border-slate-700 flex justify-between items-center bg-slate-800/90">
                            <div className="text-white font-bold text-lg">
                                Toplam Puan: <span className="text-green-400 text-2xl">{totalScore}</span> <span className="text-slate-400 text-sm">/ {maxPossible}</span>
                            </div>
                            <div className="flex gap-3">
                                <button onClick={onClose} className="py-2 px-5 bg-slate-600 text-white rounded-lg hover:bg-slate-500 font-semibold">Kapat</button>
                                <button onClick={onSave} className="py-2 px-6 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-bold">Kaydet</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        });

        const StudentAssessmentCard = memo(({ student, index, semester, onScoreChange }) => {
            const donemKey = semester === 1 ? 'donem1' : 'donem2';
            const assessment = student.assessments?.[donemKey] || {};

            const perf1 = calculateWeightedPerf1(assessment) ?? '-';
            const validKitap = [assessment.kitap1, assessment.kitap2].filter(n => n !== null && n !== undefined && n !== '' && !isNaN(n));
            const perf2 = validKitap.length === 0 ? '-' : Math.round(validKitap.reduce((a, b) => a + Number(b), 0) / validKitap.length);

            const NoteInput = ({ type, label }) => {
                const [val, setVal] = useState(assessment[type] === null || assessment[type] === undefined ? '' : assessment[type]);
                useEffect(() => {
                    setVal(assessment[type] === null || assessment[type] === undefined ? '' : assessment[type]);
                }, [assessment[type]]);
                return (
                    <div className="flex justify-between items-center space-x-2">
                        <label className="text-slate-400 text-sm">{label}</label>
                        <input
                            type="number"

        function PerformancePanel({ user }) {

            // Seçili sınıfın konuşma kriterlerini getir (Yoksa sınıf adına göre 9. sınıf veya standart varsayılanı getir)
            const getClassSpeakingCriteria = useCallback((cls) => {
                if (!cls) return DEFAULT_SPEAKING_PRESET;
                if (cls.speakingCriteria && Array.isArray(cls.speakingCriteria) && cls.speakingCriteria.length > 0) {

                const isNinth = cls.name && cls.name.trim().startsWith('9');

            useEffect(() => {
                if (user) {

                    const docRef = db.collection('userData').doc(user.uid);
                    const unsubscribe = docRef.onSnapshot(doc => {

                            const data = doc.data();
                            const currentSettings = data.settings || settings;
                            if (data.settings) {
                                setSettings(data.settings);
                                setTempSettings(data.settings);
                            }

                            const calcSync = (scores) => {
                                if (!scores) return currentSettings.baseScore;
                                const sc = currentSettings.baseScore +
                                    (scores.inClassPlus * currentSettings.inClassPlus) +
                                    (scores.inClassMinus * currentSettings.inClassMinus) +

                                const classCriteria = (cls.speakingCriteria && cls.speakingCriteria.length > 0) ? cls.speakingCriteria : defaultCrit;

                                const migratedStudents = (cls.students || []).map(student => {
                                    if (!student.scores || !student.scores.donem1) {
                                        const oldScores = (student.scores && student.scores.inClassPlus !== undefined) ? JSON.parse(JSON.stringify(student.scores)) : { ...defaultScores };
                                        student.scores = { donem1: oldScores, donem2: { ...defaultScores } };
                                    }
                                    if (!student.assessments || !student.assessments.donem1?.hasOwnProperty('dersIciDurum')) {
                                        student.assessments = JSON.parse(JSON.stringify(newAssessmentStructure));

                                        student.speakingExams = JSON.parse(JSON.stringify(newSpeakingExamStructure));
                                    }
                                    // Eski 9. sınıf konuşma verisi varsa speakingExams içine birleştir
                                    if (student.speakingExams9th) {
                                        ['donem1', 'donem2'].forEach(dKey => {
                                            ['sinav1', 'sinav2'].forEach(sKey => {
                                                if (!student.speakingExams[dKey][sKey] && student.speakingExams9th[dKey]?.[sKey]) {
                                                    student.speakingExams[dKey][sKey] = student.speakingExams9th[dKey][sKey];
                                                }
                                            });
                                        });
                                    }
                                    if (student.schoolNumber === undefined) student.schoolNumber = '';

                                    student.assessments.donem1.dersIciDurum = calcSync(student.scores.donem1);
                                    student.assessments.donem2.dersIciDurum = calcSync(student.scores.donem2);
                                    return student;
                                });

                                return {
                                    ...cls,
                                    bookTitles: cls.bookTitles || JSON.parse(JSON.stringify(newBookTitleStructure)),
                                    speakingCriteria: classCriteria,
                                    students: sortStudentsList(migratedStudents)
                                };
                            });

                            setClasses(migratedClasses);
                            if (migratedClasses.length > 0 && !activeClassId) {
                                setActiveClassId(migratedClasses[0].id);
                            }
                        }
                        setIsLoading(false);
                    }, err => {
                        console.error("Veri okuma hatası:", err);
                        setIsLoading(false);
                    });
                    return () => unsubscribe();
                }
            }, [user]);

            useEffect(() => {
                const handler = setTimeout(() => {
                    if (!isLoading && user && activeView === 'classes') {
                        db.collection('userData').doc(user.uid).set({ classes, settings }, { merge: true });
                    }
                }, 1200);
                return () => clearTimeout(handler);
            }, [classes, settings, user, isLoading, activeView]);

            useEffect(() => {
                if (activeView === 'assessments' && activeClass) {
                    setTempClassData(JSON.parse(JSON.stringify(activeClass)));
                } else {
                    setTempClassData(null);
                }
            }, [activeView, activeClassId, classes]);

            // e-OKUL PDF YÜKLEME (Sınıf Adını, Okul/Öğretmen Bilgisini ve Öğrencileri Otomatik Ayıklar)
            const handleEokulPdfUpload = async (e, targetClassId = null) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsParsingPdf(true);
                setPdfStatusMsg('PDF analiz ediliyor...');

                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let extractedStudents = [];
                    let detectedClassName = '';
                    let detectedSchool = '';
                    let detectedBranch = '';

                    const blacklist = [
                        'OKUL', 'KURUM', 'DÖNEM', 'PUAN', 'ÇİZELGESİ', 'ÖĞRENCİ', 'SINAVLAR',
                        'YAZILI', 'PERFORMANS', 'UYGULAMA', 'PROJE', 'MUAF', 'NUMARASI', 'SIRA',
                        'ADI SOYADI', 'DERS', 'ÖĞRETMENİ', 'MÜDÜR', 'YARDIMCISI', 'DEVAMSIZLIKTAN',
                        'BAŞARISIZ', 'SAYILAN', 'ALANI', 'DALI', 'ŞUBESİ', 'SAATİ', 'HAFTALIK',
                        'TÜRK DİLİ', 'EDEBİYATI', 'İSTANBUL', 'ANADOLU', 'LİSESİ', 'CE-OKUL'
                    ];

                    for (let pageNum = 1; pdf.numPages >= pageNum; pageNum++) {
                        const page = await pdf.getPage(pageNum);
                        const textContent = await page.getTextContent();
                        const fullPageText = textContent.items.map(i => i.str).join(' ');

                        // Sınıf ve Şube adını otomatik yakala (Örn: "9. Sınıf / F Şubesi" -> "9-F")
                        if (!detectedClassName) {
                            const clsMatch = fullPageText.match(/(\d+)\.\s*Sınıf\s*\/\s*([A-ZÇĞİÖŞÜ])\s*Şubesi/i);
                            if (clsMatch) {
                                detectedClassName = `${clsMatch[1]}-${clsMatch[2].toUpperCase()}`;
                            }
                        }

                        // Y koordinatına göre satırları birleştir
                        const rows = [];
                        textContent.items.forEach(item => {
                            const str = item.str.trim();
                            if (!str) return;
                            const y = item.transform[5];
                            const x = item.transform[4];
                            let row = rows.find(r => 4 > Math.abs(r.y - y));
                            if (!row) {
                                row = { y, items: [] };
                                rows.push(row);
                            }
                            row.items.push({ x, str });
                        });

                        rows.sort((a, b) => b.y - a.y);

                        rows.forEach(row => {
                            row.items.sort((a, b) => a.x - b.x);
                            const lineText = row.items.map(i => i.str).join(' ').replace(/\|/g, ' ').replace(/\s+/g, ' ').trim();

                            // Öğrenci satırı: "434 1 MUHAMMED ALSILES" veya "3 559 RAMAZAN AYAZ"
                            const matchTwoNums = lineText.match(/^(\d+)\s+(\d+)\s+([A-ZÇĞİÖŞÜa-zçğıöşü\s]{3,})$/);
                            if (matchTwoNums) {
                                const n1 = parseInt(matchTwoNums[1], 10);
                                const n2 = parseInt(matchTwoNums[2], 10);
                                const rawName = matchTwoNums[3].trim();
                                const upperName = rawName.toLocaleUpperCase('tr-TR');
                                const isBlacklisted = blacklist.some(w => upperName.includes(w));

                                if (!isBlacklisted && rawName.includes(' ')) {
                                    // Sıra no (1..len+5) ile okul numarasını ayırt et
                                    const expectedSeq = extractedStudents.length + 1;
                                    let schoolNo = n1;
                                    if (n1 === expectedSeq && n2 !== expectedSeq) {
                                        schoolNo = n2;
                                    } else if (n2 === expectedSeq && n1 !== expectedSeq) {
                                        schoolNo = n1;
                                    } else if (60 >= n1 && n2 > 60) {
                                        schoolNo = n2;
                                    } else if (60 >= n2 && n1 > 60) {
                                        schoolNo = n1;
                                    } else {
                                        schoolNo = Math.max(n1, n2);
                                    }
                                    extractedStudents.push({ schoolNumber: String(schoolNo), name: rawName });
                                }
                            }
                        });
                    }

                    if (extractedStudents.length === 0) {
                        alert("PDF dosyasından öğrenci listesi okunamadı. Lütfen e-Okul Puan Çizelgesi formatında bir PDF seçtiğinizden emin olun.");
                        return;
                    }

                    const baseScoreVal = settings.baseScore;
                    const newStudentObjects = extractedStudents.map((st, idx) => ({
                        id: Date.now() + idx,
                        schoolNumber: st.schoolNumber,
                        name: st.name,
                        notes: '',
                        scores: { donem1: { ...defaultScores }, donem2: { ...defaultScores } },
                        assessments: {
                            donem1: { dersIciDurum: baseScoreVal, yazma1: null, yazma2: null, kitap1: null, kitap2: null },
                            donem2: { dersIciDurum: baseScoreVal, yazma1: null, yazma2: null, kitap1: null, kitap2: null }
                        },
                        speakingExams: JSON.parse(JSON.stringify(newSpeakingExamStructure))
                    }));

                    const finalClassName = detectedClassName || file.name.replace(/\.pdf$/i, '').toUpperCase();
                    const isNinth = finalClassName.startsWith('9');

                    let updatedClasses = [...classes];
                    let selectedId = targetClassId;

                    if (!selectedId) {
                        // Aynı isimde sınıf var mı kontrol et
                        const existingCls = updatedClasses.find(c => c.name.toLocaleUpperCase('tr-TR') === finalClassName.toLocaleUpperCase('tr-TR'));
                        if (existingCls) {
                            selectedId = existingCls.id;
                        }
                    }

                    if (selectedId) {
                        updatedClasses = updatedClasses.map(c => {
                            if (c.id !== selectedId) return c;
                            const existingNums = new Set(c.students.map(s => s.schoolNumber));
                            const filteredNew = newStudentObjects.filter(s => !existingNums.has(s.schoolNumber));
                            return { ...c, students: sortStudentsList([...c.students, ...filteredNew]) };
                        });
                        setActiveClassId(selectedId);
                    } else {
                        const newCls = {
                            id: Date.now(),
                            name: finalClassName,
                            students: sortStudentsList(newStudentObjects),
                            bookTitles: JSON.parse(JSON.stringify(newBookTitleStructure)),
                            speakingCriteria: isNinth ? NINTH_GRADE_SPEAKING_PRESET : DEFAULT_SPEAKING_PRESET
                        };
                        updatedClasses.push(newCls);
                        setActiveClassId(newCls.id);
                    }

                    setClasses(updatedClasses);
                    db.collection('userData').doc(user.uid).set({ classes: updatedClasses }, { merge: true });
                    setPdfStatusMsg(`${finalClassName} sınıfı (${extractedStudents.length} öğrenci) başarıyla aktarıldı!`);
                    setTimeout(() => setPdfStatusMsg(''), 4000);
                } catch (err) {
                    console.error("PDF okuma hatası:", err);
                    alert("PDF okunurken hata oluştu: " + err.message);
                } finally {
                    setIsParsingPdf(false);
                    e.target.value = '';
                }
            };

            // Konuşma Sınavı Kriterlerini Kaydetme
            const handleSaveClassCriteria = (newCriteriaList) => {
                if (!activeClassId) return;
                const updatedClasses = classes.map(c => c.id === activeClassId ? { ...c, speakingCriteria: newCriteriaList } : c);
                setClasses(updatedClasses);

                setIsCriteriaModalOpen(false);
            };

            const handleCopyCriteriaToAllClasses = (newCriteriaList) => {

                setClasses(updatedClasses);
                db.collection('userData').doc(user.uid).set({ classes: updatedClasses }, { merge: true });
                setIsCriteriaModalOpen(false);
            };

            const handleOpenSpeakingModal = (student, semester, examNumber) => {
                const donemKey = semester === 1 ? 'donem1' : 'donem2';
                const sinavKey = examNumber === 1 ? 'sinav1' : 'sinav2';
                const criteria = getClassSpeakingCriteria(activeClass);
                const currentScores = student.speakingExams?.[donemKey]?.[sinavKey] || {};
                const initialScores = {};
                criteria.forEach(c => {
                    initialScores[c.id] = currentScores[c.id] !== undefined ? currentScores[c.id] : null;
                });
                setEvaluatingSpeaking({ student, semester, examNumber, scores: initialScores, criteria });
            };

            const handleSpeakingScoreChange = (criterionId, value) => {
                setEvaluatingSpeaking(prev => ({
                    ...prev,
                    scores: { ...prev.scores, [criterionId]: value }
                }));
            };

            const handleSaveSpeakingExam = () => {
                if (!evaluatingSpeaking) return;
                const { student, semester, examNumber, scores } = evaluatingSpeaking;
                const donemKey = semester === 1 ? 'donem1' : 'donem2';
                const sinavKey = examNumber === 1 ? 'sinav1' : 'sinav2';
                const updatedClasses = classes.map(cls => {
                    if (cls.id !== activeClassId) return cls;
                    return {
                        ...cls,
                        students: cls.students.map(s => {
                            if (s.id !== student.id) return s;
                            const newSpeakingExams = JSON.parse(JSON.stringify(s.speakingExams || newSpeakingExamStructure));
                            if (!newSpeakingExams[donemKey]) newSpeakingExams[donemKey] = { sinav1: null, sinav2: null };
                            newSpeakingExams[donemKey][sinavKey] = scores;
                            return { ...s, speakingExams: newSpeakingExams };
                        })
                    };
                });
                setClasses(updatedClasses);
                setEvaluatingSpeaking(null);
                db.collection('userData').doc(user.uid).set({ classes: updatedClasses }, { merge: true });
            };

            // Dinamik Konuşma Sınavı Özet Raporu (Yatay - Sınav 1 & Sınav 2 + Kriter Açıklamaları)
            const handleGenerateDynamicSpeakingSummaryReport = (semester) => {
                if (!activeClass) return;
                setIsGeneratingPdf(true);
                const donemKey = semester === 1 ? 'donem1' : 'donem2';
                const students = activeClass.students;
                const criteria = getClassSpeakingCriteria(activeClass);
                const studentsPerPage = 15;
                const numPages = Math.ceil(students.length / studentsPerPage);

                const criteriaHeaders = () => criteria.map((c, i) => `<th style="border: 1px solid #333; padding: 4px; font-size: 8px;">K.${i + 1}<br/>(${c.max}p)</th>`).join('');
                const criteriaNotes = criteria.map((c, i) => `<li><b>K.${i + 1} (${c.max} Puan):</b> ${c.label}</li>`).join('');

                let htmlContent = '';
                for (let i = 0; numPages > i; i++) {
                    const chunk = students.slice(i * studentsPerPage, (i + 1) * studentsPerPage);
                    const rows = chunk.map((student, idx) => {
                        const globalIndex = i * studentsPerPage + idx + 1;
                        const s1 = student.speakingExams?.[donemKey]?.sinav1 || {};
                        const s2 = student.speakingExams?.[donemKey]?.sinav2 || {};
                        const t1 = criteria.reduce((sum, c) => sum + (Number(s1[c.id]) || 0), 0);
                        const t2 = criteria.reduce((sum, c) => sum + (Number(s2[c.id]) || 0), 0);
                        const ort = (t1 > 0 || t2 > 0) ? Math.round((t1 + t2) / ((t1 > 0 ? 1 : 0) + (t2 > 0 ? 1 : 0))) : '-';

                        const cells = (scores) => criteria.map(c => `<td style="border: 1px solid #ccc; padding: 4px; font-size: 8.5px;">${scores[c.id] ?? '-'}</td>`).join('');

                        return `<tr style="${globalIndex % 2 === 0 ? 'background-color: #f8fafc;' : ''}">
                            <td style="border: 1px solid #333; padding: 4px; font-size: 8.5px;">${student.schoolNumber || globalIndex}</td>
                            <td style="border: 1px solid #333; padding: 4px; text-align: left; font-size: 8.5px;">${student.name}</td>
                            ${cells(s1)}<td style="border: 1px solid #333; padding: 4px; font-weight: bold; background-color: #e0f2fe; font-size: 9px;">${t1 || '-'}</td>
                            ${cells(s2)}<td style="border: 1px solid #333; padding: 4px; font-weight: bold; background-color: #ffedd5; font-size: 9px;">${t2 || '-'}</td>

                            onClose={() => setIsCriteriaModalOpen(false)}
                        />
                    )}

                    {evaluatingSpeaking && (
                        <DynamicSpeakingExamModal
                            student={evaluatingSpeaking.student}
                            criteria={evaluatingSpeaking.criteria}
                            scores={evaluatingSpeaking.scores}
                            examNumber={evaluatingSpeaking.examNumber}
                            className={activeClass?.name}
                            onScoreChange={handleSpeakingScoreChange}
                            onSave={handleSaveSpeakingExam}
                            onClose={() => setEvaluatingSpeaking(null)}
                        />
                    )}

                    {classToDelete && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-800 rounded-xl p-6 border border-slate-700 max-w-md w-full">
                                <h3 className="text-lg font-bold text-white mb-2">Sınıfı Sil</h3>
                                <p className="text-slate-300 text-sm mb-5">"{classToDelete.name}" sınıfını silmek istediğinize emin misiniz?</p>
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setClassToDelete(null)} className="py-2 px-4 bg-slate-600 text-white rounded-lg text-sm">Vazgeç</button>
                                    <button onClick={() => { const updated = classes.filter(c => c.id !== classToDelete.id); setClasses(updated); if (activeClassId === classToDelete.id) setActiveClassId(updated[0]?.id || null); setClassToDelete(null); }} className="py-2 px-4 bg-red-600 text-white rounded-lg font-bold text-sm">Sil</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {studentToDelete && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-800 rounded-xl p-6 border border-slate-700 max-w-md w-full">
                                <h3 className="text-lg font-bold text-white mb-2">Öğrenciyi Sil</h3>
                                <p className="text-slate-300 text-sm mb-5">"{studentToDelete.name}" isimli öğrenciyi silmek istediğinize emin misiniz?</p>
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setStudentToDelete(null)} className="py-2 px-4 bg-slate-600 text-white rounded-lg text-sm">Vazgeç</button>
                                    <button onClick={() => { setClasses(prev => prev.map(c => c.id === activeClassId ? { ...c, students: c.students.filter(s => s.id !== studentToDelete.id) } : c)); setStudentToDelete(null); }} className="py-2 px-4 bg-red-600 text-white rounded-lg font-bold text-sm">Sil</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {editingNoteStudent && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-800 rounded-xl p-6 border border-slate-700 max-w-lg w-full">
                                <h3 className="text-lg font-bold text-white mb-3">Öğrenci Notu: <span className="text-blue-400">{editingNoteStudent.name}</span></h3>
                                <textarea
                                    defaultValue={editingNoteStudent.notes}
                                    id="student-note-textarea"
                                    className="w-full h-40 p-3 bg-slate-700 border border-slate-600 rounded-lg text-white text-sm mb-4"
                                    placeholder="Öğrenci hakkında notunuz..."
                                />
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setEditingNoteStudent(null)} className="py-2 px-4 bg-slate-600 text-white rounded-lg text-sm">Kapat</button>
                                    <button onClick={() => { const val = document.getElementById('student-note-textarea').value; setClasses(prev => prev.map(c => c.id === activeClassId ? { ...c, students: c.students.map(s => s.id === editingNoteStudent.id ? { ...s, notes: val } : s) } : c)); setEditingNoteStudent(null); }} className="py-2 px-5 bg-blue-600 text-white rounded-lg font-bold text-sm">Kaydet</button>
                                </div>
                            </div>
                        </div>
                    )}
                </Fragment>
            );
        }

        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(u => {
                    setUser(u);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (loading) return <div className="text-center text-white text-xl mt-20">Yükleniyor...</div>;
            return user ? <PerformancePanel user={user} /> : <AuthScreen />;
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
